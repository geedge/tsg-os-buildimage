image: "git.mesalab.cn:7443/mesa_platform/build-env:master"
variables:
  GIT_STRATEGY: "clone"

build:
    stage: build
    script:
      - yum -y install ansible pbzip2
      - make
    tags:
    - share
    except:
    - tags
    artifacts:
      name: "tsg-os-build-$CI_COMMIT_REF_NAME"
      paths:
        - images/*.bin