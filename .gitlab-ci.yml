  extends: .build_tsg-buildimage
  variables:
    PROFILE_LIST: 9000NPBP01R01
    DALIY_BUILD_VERSION: 1
    UPLOAD_TO_FILE_REPO: 0
  except:
    - tags
    - /^dev-.*$/i
