#image: "git.mesalab.cn:7443/mesa_platform/build-env:master"
variables:
  GIT_STRATEGY: "clone"
  BUILD_BASED_IMAGE_CENTOS7: "git.mesalab.cn:7443/mesa_platform/build-env:master"
  BUILD_BASED_IMAGE_ROCKYLINUX8: "git.mesalab.cn:7443/mesa_platform/build-env:rockylinux-dindind"
  GIT_DEPTH: 1

stages:
  - build
  - merge_build
  - deploy
  - notify

.build_tsg-buildimage:
  script:
    - env | sort
    - yum -y install pbzip2 ansible
    - make DALIY_BUILD_VERSION=$DALIY_BUILD_VERSION
    - chmod +x ./tools/upload.sh
    - ./tools/upload.sh 
  tags:
    - tsg-os-installer

.build_onie_bin_x86_64_COTS:
  script:
    - env | sort
    - yum -y install pbzip2 python39
    - python3.9 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple ansible
    - make DALIY_BUILD_VERSION=$DALIY_BUILD_VERSION
    - chmod +x ./tools/upload.sh
    - ./tools/upload.sh 
  tags:
    - tsg-os-builder-el8

.build_container_images_x86_64_COTS:
  script:
    - env | sort
    - yum -y remove docker-ce
    - yum -y install pbzip2 buildah podman python39
    - python3.9 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple ansible
    - make DALIY_BUILD_VERSION=$DALIY_BUILD_VERSION
    - chmod +x ./tools/upload.sh
    - ./tools/upload.sh 
  tags:
    - tsg-os-builder-el8

.notify_jobs_done:
  cache:
    key: $CI_COMMIT_REF_SLUG-x86_64_COTS
    paths:
      - images/
  script:
      - chmod +x ./tools/notify-jobs-done.sh
      - ./tools/notify-jobs-done.sh
  tags:
    - tsg-os-builder-el8

.build_tsg_vm_image:
  cache:
    key: $BUILD_OS_CACHE_KEY
    paths:
      - images/
  script:
    - yum install -y qemu-img qemu-kvm telnet net-tools procps-ng httpd
    - find / -name images
    - ls -lh
    - export VM_IMG_NAME=$(basename -s .bin images/*-ONIE.bin)
    - echo $VM_IMG_NAME
    - cp images/$VM_IMG_NAME.bin /var/www/html/onie-installer-x86_64.bin
    - httpd
    - chmod +x ./tools/mk-kvm.sh
    - cp ./tools/onie-base-kvm.img images/$VM_IMG_NAME.img
    - ./tools/mk-kvm.sh images/$VM_IMG_NAME.img
    - qemu-img convert -O qcow2 -c images/$VM_IMG_NAME.img images/$VM_IMG_NAME-kvm.img
    - rm -rf images/$VM_IMG_NAME.img
    - ls -lh images
    - chmod +x ./tools/mk-kvm-gns3a.sh
    - ./tools/mk-kvm-gns3a.sh images/$VM_IMG_NAME-kvm.img images/$VM_IMG_NAME.gns3a
    - cat images/$VM_IMG_NAME.gns3a
    - ls -lh images
    - chmod +x ./tools/upload.sh
    - ./tools/upload.sh
    - find ./images/ -type f | awk -F '/' '{print $NF}' > /tmp/has-built-files.txt
    - rm -rf images/*
    - mv /tmp/has-built-files.txt ./images
  tags:
    - tsg-os-builder-el8

