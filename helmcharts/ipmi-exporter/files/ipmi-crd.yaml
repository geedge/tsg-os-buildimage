apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ipmi-exporter
  namespace: kube-system
spec:
  chart: https://%{KUBERNETES_API}%/static/charts/prometheus-ipmi-exporter-0.5.0.tgz
  targetNamespace: tsg-os-system
  valuesContent: |-
    fullnameOverride: ipmi-exporter
    image:
      pullPolicy: Never
    service:
      annotations:
        prometheus.io/scrape: "true"
