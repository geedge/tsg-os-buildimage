    - {role: system-init, tags: system-init}
    - {role: consul, tags: consul}
    - {role: hasp, tags: hasp}
    - {role: OFED, tags: OFED}
    - {role: sosreport, tags: sosreport}
    - {role: nm-config, tags: nm-config}
    - {role: tsg-os-logo, tags: tsg-os-logo}
