- name: "download rpm packages: shaping_master"
  yum:
    name:
      - "{{ shaping_master_rpm_version.shaping_master }}"
    conf_file: "{{ rpm_repo_config_path }}"
    state: present
    download_only: yes
    download_dir: "{{ path_download }}"

- name: "Install shaping_master that is sapp plugins"
  shell: rpm -i /tmp/rpm_download/{{ shaping_master_rpm_version.shaping_master }}* --prefix {{ prefix_path.sapp }}
