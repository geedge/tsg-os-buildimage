apiVersion: apps/v1
kind: Deployment
metadata:
  name: trex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trex
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: trex
    spec:
      hostNetwork: true
      containers:
      - name: trex
        image: registry.gdnt-cloud.website/trex:{{ .Chart.AppVersion }}
        command: 
          - "bash"
          - "-ec"
          - |
            chmod +x /opt/tsg/trex/generate-trex-conf.sh
            echo 'export PATH=$PATH:/opt/tsg/perf-bench-tool' >> ~/.bashrc
            echo 'eval "$(register-python-argcomplete pbt)"' >> ~/.bashrc
            source ~/.bashrc
            /opt/tsg/trex/generate-trex-conf.sh
            while true; do sleep 1024;done
        securityContext:
          privileged: true
        resources: 
          limits:
            hugepages-1Gi: {{.Values.trex.hugepages }}Gi
            nic-uio/trex: 1
{{- if .Values.trex.interfaces }}
{{- range $interface := .Values.trex.interfaces }}
            nic-uio/{{ $interface }}: 1
{{- end }}
{{- end }}
          requests:
            hugepages-1Gi: {{.Values.trex.hugepages }}Gi
            memory: 100Mi
        env:
        - name: CPU_AFFINITY
          value: {{ range $index, $cpu :=.Values.trex.cpu_affinity -}}{{- if eq $index 0 -}}{{$cpu}}{{- else -}},{{$cpu}}{{- end -}}{{- end }}
        - name: TREX_PATH
          value: /opt/tsg/trex/v3.02
        - name: PBT_PATH
          value: /opt/tsg/perf-bench-tool
        - name: PYTHONPATH
          value: /opt/tsg/trex/v3.02/automation/trex_control_plane/interactive/
        volumeMounts:
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: modules
          mountPath: /lib/modules
        - name: mem
          mountPath: /dev/mem
        - name: hugepage-1gi
          mountPath: /var/run/trex/hugepages
      volumes:
      - name: mem
        hostPath:
          path: /dev/mem
      - name: modules
        hostPath: 
          path: /lib/modules
      - name: dev-vfio
        hostPath:
          path: /dev/vfio
      - name: hugepage-1gi
        emptyDir:
          medium: HugePages-1Gi

