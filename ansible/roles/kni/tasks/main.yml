---
- name: "install kni rpms from localhost"
  yum:
    name:
      - "{{ kni_rpm_version }}"
    conf_file: "{{ rpm_repo_config_path }}"
    state: present

- name: Template the kni.conf
  template:
    src: "{{ role_path }}/templates/kni.conf.j2"
    dest: /home/mesasoft/sapp_run/etc/kni/kni.conf
  tags: template


