---
- name: "copy i40e drive rpms to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: "/tmp/i40e_drive/"

- name: "install i40e drive"
  yum:
    name:
      - /tmp/i40e_drive/i40e-2.11.29-1.x86_64.rpm
    state: present

- name: "install iavf"
  yum:
    name:
      - /tmp/i40e_drive/iavf-4.1.1-1.x86_64.rpm
    state: present

- name: "update  depmod"
  shell: depmod -v 5.4.159-1.el7.elrepo.x86_64