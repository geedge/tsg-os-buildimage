[global]
default format = "%d(%c), %V, %F, %U, %m%n"
rotate lock file = /tmp/certstore_zlog.lock
file perms = 644
[levels]
DEBUG=10
INFO=20
FATAL=30
[formats]
stdoutfatal = "%c %d(%c), %V, %F, %U, %m%n"
[rules]
*.fatal        "./logs/error.log.%d(%F)";
*.fatal        "./logs/certstore.log.%d(%F)";
*.fatal    >stdout; stdoutfatal