- name: "update all"
  yum:
    name: '*'
    conf_file: "{{ rpm_repo_config_path }}"
    state: latest

- name: "hotfix for dnf broken"
  shell:
    cmd: "dnf upgrade --refresh rpm glibc && rm /var/lib/rpm/.rpm.lock && dnf upgrade dnf"

- name: "install tcpdump"
  yum:
    name: tcpdump
    conf_file: "{{ rpm_repo_config_path }}"
    state: present

- name: "install numactl-libs"
  yum:
    name: numactl-libs
    conf_file: "{{ rpm_repo_config_path }}"
    state: present

- name: "install iproute"
