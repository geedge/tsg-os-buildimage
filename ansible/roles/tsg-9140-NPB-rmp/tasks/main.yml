---
- name: "copy jut_shm-1.0.0-1.x86_64.rpm to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: "/tmp/jut_shm/"
    mode: 0755

- name: "install jut_shm-1.0.0-1.x86_64.rpm"
  yum:
    name:
      - /tmp/jut_shm/jut_shm-1.0.0-1.x86_64.rpm
    state: present

- name: "set jut_shm cfg"
  template:
    src: "{{ role_path }}/files/jut_shm.conf"
    dest: /usr/local/jut_shm/bin/jut_shm.conf
    mode: 0755
  tags: template