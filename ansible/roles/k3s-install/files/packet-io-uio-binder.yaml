apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: packet-io-uio-binder
  labels:
    app: packet-io-uio-binder
  namespace: tsg-os-system
spec:
  selector:
    matchLabels:
      app: packet-io-uio-binder
  template:
    metadata:
      labels:
        app: packet-io-uio-binder
    spec:
      containers:
      - name: packet-io-uio-binder
        image: registry.gdnt-cloud.website/tsg-packet-io-uio-binder:%%MRZCPD_DEVICE_PLUGIN_IMAGE_TAG%%
        command:
          - "bash"
          - "-ec"
          - |
            /opt/tsg/packet-io-uio-binder/bin/deviceplugin 
        volumeMounts:
        - name: hwfile
          mountPath: /var/run/mrzcpd
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: k3s-api
          mountPath: /var/lib/kubelet
        - name: modules
          mountPath: /lib/modules
        securityContext:
          privileged: true
      initContainers:
      - name: init-packet-io-uio-binder
        image: registry.gdnt-cloud.website/tsg-packet-io-uio-binder:%%MRZCPD_DEVICE_PLUGIN_IMAGE_TAG%%
        command: 
          - "bash"
          - "-ec"
          - |
            /opt/tsg/packet-io-uio-binder/bin/generateHwfile
        volumeMounts:
        - name: hwfile
          mountPath: /var/run/mrzcpd
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: k3s-api
          mountPath: /var/lib/kubelet
        - name: modules
          mountPath: /lib/modules
        securityContext:
          privileged: true
      volumes:
      - name: hwfile
        hostPath:
          path: /var/run/mrzcpd
          type: DirectoryOrCreate
      - name: dev-vfio
        hostPath:
          path: /dev/vfio
      - name: k3s-api
        hostPath:
          path: /var/lib/kubelet/
      - name: modules
        hostPath: 
          path: /lib/modules
      hostNetwork: true