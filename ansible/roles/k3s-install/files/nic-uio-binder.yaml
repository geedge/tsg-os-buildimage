apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nic-uio-binder
  labels:
    app: nic-uio-binder
  namespace: tsg-os-system
spec:
  selector:
    matchLabels:
      app: nic-uio-binder
  template:
    metadata:
      labels:
        app: nic-uio-binder
    spec:
      containers:
      - name: nic-uio-binder
        image: registry.gdnt-cloud.website/tsg-nic-uio-binder:%%NIC_UIO_BINDER_IMAGE_TAR%%
        command:
          - "bash"
          - "-ec"
          - |
            /opt/tsg/nic-uio-binder/bin/nic-uio-binder
        volumeMounts:
        - name: hwfile
          mountPath: /var/run/mrzcpd
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: k3s-api
          mountPath: /var/lib/kubelet
        - name: modules
          mountPath: /lib/modules
        securityContext:
          privileged: true
      initContainers:
      - name: init-nic-uio-binder
        image: registry.gdnt-cloud.website/tsg-nic-uio-binder:%%NIC_UIO_BINDER_IMAGE_TAR%%
        command: 
          - "bash"
          - "-ec"
          - |
            /opt/tsg/nic-uio-binder/bin/generateHwfile
        volumeMounts:
        - name: hwfile
          mountPath: /var/run/mrzcpd
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: k3s-api
          mountPath: /var/lib/kubelet
        - name: modules
          mountPath: /lib/modules
        securityContext:
          privileged: true
      volumes:
      - name: hwfile
        hostPath:
          path: /var/run/mrzcpd
          type: DirectoryOrCreate
      - name: dev-vfio
        hostPath:
          path: /dev/vfio
      - name: k3s-api
        hostPath:
          path: /var/lib/kubelet/
      - name: modules
        hostPath: 
          path: /lib/modules
      hostNetwork: true