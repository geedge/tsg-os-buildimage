apiVersion: v1
kind: ServiceAccount
metadata:
  name: nic-uio-binder-account
  namespace: tsg-os-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nic-uio-binder-account-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nic-uio-binder-account-pods
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","patch","watch","update","create","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nic-uio-binder-account-services
rules:
- apiGroups: [""]
  resources: ["endpoints", "services"]
  verbs: ["get","list","watch","update","create","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nic-uio-binder-account-binding-nodes
subjects:
  - kind: ServiceAccount
    namespace: tsg-os-system
    name: nic-uio-binder-account
    apiGroup: ""
roleRef:
  kind: ClusterRole
  name: nic-uio-binder-account-nodes
  apiGroup: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nic-uio-binder-account-binding-pods
subjects:
  - kind: ServiceAccount
    namespace: tsg-os-system
    name: nic-uio-binder-account
    apiGroup: ""
roleRef:
  kind: ClusterRole
  name: nic-uio-binder-account-pods
  apiGroup: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nic-uio-binder-account-binding-services
subjects:
- kind: ServiceAccount
  namespace: tsg-os-system
  name: nic-uio-binder-account
  apiGroup: ""
roleRef:
  kind: ClusterRole
  name: nic-uio-binder-account-services
  apiGroup: ""
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nic-uio-binder
  labels:
    app: nic-uio-binder
  namespace: tsg-os-system
spec:
  selector:
    matchLabels:
      app: nic-uio-binder
  template:
    metadata:
      labels:
        app: nic-uio-binder
    spec:
      serviceAccountName: nic-uio-binder-account
      containers:
      - name: nic-uio-binder
        image: registry.gdnt-cloud.website/tsg-nic-uio-binder:%%NIC_UIO_BINDER_IMAGE_TAR%%
        command:
          - "bash"
          - "-ec"
          - |
            /opt/tsg/nic-uio-binder/bin/nic-uio-binder
        volumeMounts:
        - name: hwfile
          mountPath: /var/run/mrzcpd
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: k3s-api
          mountPath: /var/lib/kubelet
        - name: modules
          mountPath: /lib/modules
        securityContext:
          privileged: true
      initContainers:
      - name: init-nic-uio-binder
        image: registry.gdnt-cloud.website/tsg-nic-uio-binder:%%NIC_UIO_BINDER_IMAGE_TAR%%
        command: 
          - "bash"
          - "-ec"
          - |
            /opt/tsg/nic-uio-binder/bin/generateHwfile
        volumeMounts:
        - name: hwfile
          mountPath: /var/run/mrzcpd
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: k3s-api
          mountPath: /var/lib/kubelet
        - name: modules
          mountPath: /lib/modules
        securityContext:
          privileged: true
      volumes:
      - name: hwfile
        hostPath:
          path: /var/run/mrzcpd
          type: DirectoryOrCreate
      - name: dev-vfio
        hostPath:
          path: /dev/vfio
      - name: k3s-api
        hostPath:
          path: /var/lib/kubelet/
      - name: modules
        hostPath: 
          path: /lib/modules
      hostNetwork: true