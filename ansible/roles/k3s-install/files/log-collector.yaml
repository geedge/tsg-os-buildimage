apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  labels:
    app: log-collector
  namespace: tsg-os-system
spec:
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      containers:
      - name: log-collector
        image: registry.gdnt-cloud.website/tsg-log-collector:%%NIC_UIO_BINDER_IMAGE_TAR%%
        command:
          - "bash"
          - "-ec"
          - |
            /opt/tsg/log-collector/bin/log-collector
        volumeMounts:
        - name: logs
          mountPath: /var/log/pods
        - name: journal-volume
          mountPath: /run/systemd/journal
        securityContext:
          privileged: true
      volumes:
      - name: logs
        hostPath:
          path: /var/log/pods
          type: DirectoryOrCreate
      - name: journal-volume
        hostPath:
          path: /run/systemd/journal
          type: Directory