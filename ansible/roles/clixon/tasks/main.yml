- name: "clixon: install libyaml"
  yum:
    name: "libyaml"
    conf_file: "{{ rpm_repo_config_path }}"
    state: latest

- name: "clixon: set symlink"
  shell: ln -vfs /lib64/libyaml-0.so.2.0.5 /usr/lib64/libyaml.so

- name: "clixon: install jinja-cli"
  shell: pip3 install -i https://pypi.tuna.tsinghua.edu.cn/simple jinja-cli

- name: "install rpm packages: tsg-os-clixon"
  yum:
    name: "{{ item.value }}"
    conf_file: "{{ rpm_repo_config_path }}"
    state: present
  with_dict: "{{ tsg_os_clixon_rpm_version }}"

- name: "clixon: enable tsg-clixon-backend"
  systemd:
    name: tsg-clixon-backend
    enabled: yes

- name: "clixon: enable tsg-clixon-restconf"
  systemd:
    name: tsg-clixon-restconf
    enabled: yes

- name: "change chart verison to /opt/tsg/clixon/etc/mgnt-srv.conf"
  shell: sed -i 's/chart_name=.*$/chart_name=traffic-engine-{{helm_chart_ver}}.tgz/g' /opt/tsg/clixon/etc/mgnt-srv.conf

- name: "change inject_adapter chart verison to /opt/tsg/clixon/etc/mgnt-srv.conf"
  shell: sed -i 's/chart_name=.*$/chart_name=inject-adapter-{{helm_chart_ver}}.tgz/g' /opt/tsg/clixon/etc/mgnt-srv.conf
