- name: "tsg-os-HAL: copy shell file to dest"
  copy:
    src: "{{ role_path }}/files/script/{{ item }}"
    dest: /opt/tsg/tsg-os-HAL/scripts/
    mode: 0755
  with_items:
    - tsg-os-HAL.sh
  when: runtime_env == 'TSG-X-P0906'

- name: "cpu_amd: copy shell file to dest"
  copy:
    src: "{{ role_path }}/files/script/{{ item }}"
    dest: /opt/tsg/tsg-os-HAL/scripts/
    mode: 0755
  with_items:
    - cpu_amd.sh
  when: runtime_env == 'TSG-X-P0906'

- name: "cpu_default: copy shell file to dest"
  copy:
    src: "{{ role_path }}/files/script/{{ item }}"
    dest: /opt/tsg/tsg-os-HAL/scripts/
    mode: 0755
  with_items:
    - cpu_default.sh
  when: runtime_env == 'TSG-X-P0906'

- name: "tsg-os-HAL: install numactl"
  yum:
    name: numactl
    conf_file: "{{ rpm_repo_config_path }}"
    state: present

- name: "install tsg-os-HAL.service -- P0906"
  copy:
    src: "{{ role_path }}/files/service/{{ item.src }}"
    dest: /usr/lib/systemd/system/{{ item.dest }}
    mode: 0644
  with_items:
    - { "src": tsg-os-HAL.service.TSGXP0906, "dest": tsg-os-HAL.service }
  when: runtime_env == 'TSG-X-P0906'

- name: "tsg-os-HAL.service: enable -- P0906"
  systemd:
    name: "{{ item }}"
    enabled: yes
  with_items:
    - tsg-os-HAL.service
  when: runtime_env == 'TSG-X-P0906'

- name: "tsg-os-HAL.conf"
  copy:
    src: "{{ role_path }}/files/conf/{{ item }}"
    dest: /etc/sysconfig/
    mode: 0755
  with_items:
    - tsg-os-HAL.conf
  when: runtime_env == 'TSG-X-P0906'

- name: "enable fstrim.timer"
  systemd:
    name: fstrim.timer
    enabled: yes
  when: runtime_env == 'TSG-X-P0906'
