- name: "copy qemu-x86_64 file to /usr/bin"
  copy:
    src: "{{ role_path }}/files/qemu-x86_64-static"
    dest: /usr/bin/
    mode: 0755

- name: "copy qemu-x86_64 conf file to /usr/lib/binfmt.d/"
  copy:
    src: "{{ role_path }}/files/qemu-x86_64.conf"
    dest: /usr/lib/binfmt.d/

