---
- name: "install mrzcpd"
  yum:
    name: "{{ mrzcpd_rpm_version.mrzcpd }}"
    conf_file: "{{ rpm_repo_config_path }}"
    state: present

- name: "update sysconfig/mrzcpd"
  template:
    src: "{{ role_path }}/templates/mrzcpd.j2"
    dest: /etc/sysconfig/mrzcpd

- name: "update mrglobal.conf - TSG9140"
  template:
    src: "{{ role_path }}/templates/tsg_9140/mrglobal.conf.j2.j2"
    dest: /opt/tsg/tsg-os-provision/templates/mrglobal.conf.j2
  when:
    - PROFILE_ID == '9000-NPB-P01R01'

- name: "update mrglobal.conf - TSG7400 - mcn0"
  template:
    src: "{{ role_path }}/templates/tsg_7400/mcn0_with_firewall/mrglobal.conf.j2.j2"
    dest: /opt/tsg/tsg-os-provision/templates/mrglobal.conf.j2
  when:
    - PROFILE_ID == '7400-MCN0-P01R01'

- name: "update mrglobal.conf - TSG7400 - mcn1 mcn2 mcn3"
  template:
    src: "{{ role_path }}/templates/tsg_7400/mcn123_with_proxy/mrglobal.conf.j2"
    dest: /opt/mrzcpd/etc/mrglobal.conf
  when:
    - PROFILE_ID == '7400-MCN123-P01R01'

##################### mrzcpd #####################
- name: "enable mrenv"
  systemd:
    name: mrenv
    enabled: yes

- name: "enable mrzcpd"
  systemd:
    name: mrzcpd
    enabled: yes

- name: "enable prometheus output - monit_device"
  systemd:
    name: mrapm_device
    enabled: yes

- name: "enable prometheus output - monit_stream"
  systemd:
    name: mrapm_stream
    enabled: yes
