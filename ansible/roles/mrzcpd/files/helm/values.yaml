# Default values for mrzcpd.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


enable_interactive_startup: no

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: 
  limits:
    hugepages-1Gi: 32Gi
  requests:
    memory: 100Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


mergeExporter:
  image:
    repository: quay.io/rebuy/exporter-merger
    pullPolicy: Never
    tag: "v0.2.0"
  mergePort: "9005"
  mergeUrls: "http://0.0.0.0:8901/metrics http://0.0.0.0:8902/metrics"

service:
  type: ClusterIP
#  nodePort: "30081"
  port: "9005"
  annotations: {}

define_enable_val_yes: 'yes'

mrzcpd:
  interfaces: []
  nf_count: 16
  services: []
  virtual_wires: []
  service_lb: {}
  service_chaining: {}
  traffic_mirror: {}
  distmode: 0
  hugepages: 32Gi
  debug:
    enable_liveness_probe: yes
    define_enable_val_yes: yes
    enable_prestart_script: no
    enable_mount_host_filesystem: no
    #default: /etc/tsg-os/${service_function_name}/shaping_prestart_script.sh
    prestart_script: ""