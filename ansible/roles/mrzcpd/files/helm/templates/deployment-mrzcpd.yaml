apiVersion: apps/v1
kind: Deployment
metadata:
  name: packet-io-engine
  labels:
    app: packet-io-engine
    component: packet-io-engine
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: packet-io-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: packet-io-engine
        serviceFunction: {{ .Release.Name }}
        component: packet-io-engine
      annotations:
        prometheus.io/port: "9005"
        prometheus.io/scrape: "true"
    
    spec: 
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: packet-io-engine
        image: "registry.gdnt-cloud.website/tsg-packet-io-engine:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/mrzcpd
        command: 
          - "bash"
          - "-ec"
          - |
            /opt/tsg/mrzcpd/bin/mrmarch --auto
            mount --rbind /opt/tsg/mrzcpd /mnt/packet-io-engine/mrzcpd

            cp -f /etc/ld.so.conf.d/mrzcpd.conf /mnt/packet-io-engine/ld.so.conf.d/mrzcpd.conf
            cp -f /etc/profile.d/mrzcpd.sh /mnt/packet-io-engine/profile.d/mrzcpd.sh
            ldconfig -C /etc/ld.so.cache -r /host

            cp -f /opt/tsg/config/mrzcpd.conf /opt/tsg/mrzcpd/etc/mrglobal.conf
            chmod +x /opt/tsg/mrzcpd/bin/replaceconf.sh
            /opt/tsg/mrzcpd/bin/replaceconf.sh

            {{ template "mrzcpd.prestart" . }}
            {{ template "mrzcpd.start" . }}
        volumeMounts:
        - name: mrzcpd
          mountPath: /mnt/packet-io-engine/mrzcpd
          mountPropagation: Bidirectional
        - name: ldconfig-mrzcpd
          mountPath: /mnt/packet-io-engine/ld.so.conf.d
        - name: env-sh
          mountPath: /mnt/packet-io-engine/profile.d
        - name: mrzcpd-conf
          mountPath: "/opt/tsg/config/mrzcpd.conf"
          subPath: mrzcpd.conf
        - name: run-mrzcpd
          mountPath: /var/run/mrzcpd
        - name: hugepages
          mountPath: /var/run/mrzcpd/hugepages
        - name: dpdk
          mountPath: /var/run/dpdk
        - name: container-mrzcpd
          mountPath: /var/run/share/container_mrzcpd.conf
        - name: dev-vfio
          mountPath: /dev/vfio
        - name: root-sys
          mountPath: /root/sys
        - name: host-root
          mountPath: /host
          mountPropagation: HostToContainer
        {{ template "mrzcpd.mount.localtime" . }}
        {{ template "mrzcpd.mount.prestart" . }}
        resources: 
          limits:
            mrzcpd/mrzcpd: 1
        {{ template "mrzcpd.resources" . }}
            hugepages-1Gi: {{.Values.mrzcpd.hugepages }}
          requests:
            memory: 100Mi
        env:
        - name: MLX5_GLUE_PATH
          value: /opt/tsg/mrzcpd/lib
{{- if eq .Values.mrzcpd.debug.enable_liveness_probe .Values.define_enable_val_yes }}
        livenessProbe:
          tcpSocket:
            port: 9086
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9086
          failureThreshold: 30
          periodSeconds: 10
{{- end }}
        securityContext:
          privileged: true

      - command:
        - /opt/tsg/mrzcpd/bin/monit_device
        - --prometheus-client
        image: "registry.gdnt-cloud.website/tsg-packet-io-engine:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        name: mrapm-device
        volumeMounts:
        - mountPath: /var/run/mrzcpd
          name: run-mrzcpd
          readOnly: true
        - mountPath: /var/run/dpdk
          name: dpdk
          readOnly: true
        - mountPath: /root/sys
          name: root-sys
          readOnly: true
        - mountPath: /etc/localtime
          name: localtime-node
          readOnly: true
      - command:
        - /opt/tsg/mrzcpd/bin/monit_stream
        - --prometheus-client
        image: "registry.gdnt-cloud.website/tsg-packet-io-engine:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        name: monit-stream
        volumeMounts:
        - mountPath: /var/run/mrzcpd
          name: run-mrzcpd
          readOnly: true
        - mountPath: /var/run/dpdk
          name: dpdk
          readOnly: true
        - mountPath: /root/sys
          name: root-sys
          readOnly: true
        - mountPath: /etc/localtime
          name: localtime-node
          readOnly: true
      - env:
        - name: MERGER_URLS
          value: {{ .Values.mergeExporter.mergeUrls }}
        - name: MERGER_PORT
          value: "{{ .Values.mergeExporter.mergePort }}"
        image: "{{ .Values.mergeExporter.image.repository }}:{{ .Values.mergeExporter.image.tag }}"
        imagePullPolicy: {{ .Values.mergeExporter.image.pullPolicy }}
        name: exporter-merger
        ports:
        - name: ex-mrzcpd-port
          containerPort: {{ .Values.mergeExporter.mergePort }}
          protocol: TCP
      volumes:
      - name: prestart-dir
        hostPath: 
          path: /etc/tsg-os/{{ .Release.Name }}/
          type: DirectoryOrCreate
      - name: mrzcpd-conf
        configMap:
          name: mrzcpd
      - name: mrzcpd
        hostPath:
          path: /opt/tsg/mrzcpd
          type: DirectoryOrCreate
      - name: run-mrzcpd
        hostPath:
          path: /var/run/mrzcpd
          type: DirectoryOrCreate
      - name: hugepages
        hostPath:
          path: /var/run/mrzcpd/hugepages
          type: DirectoryOrCreate
      - name: env-sh
        hostPath:
          path: /etc/profile.d
          type: Directory
      - name: dpdk
        hostPath:
          path: /var/run/dpdk
          type: DirectoryOrCreate
      - name: ldconfig-mrzcpd
        hostPath:
          path: /etc/ld.so.conf.d
          type: Directory
      - name: container-mrzcpd
        hostPath:
          path:  /var/run/share/container_mrzcpd.conf
          type: File
      - name: root-sys
        hostPath:
          path: /root/sys
      - name: dev-vfio
        hostPath:
          path: /dev/vfio
      {{ template "mrzcpd.volume.localtime" . }}
      {{ template "mrzcpd.volume.prestart" . }}
      {{ template "mrzcpd.volume.hostpath" . }}
      hostNetwork: true
