[MAAT]
PROFILE="./tsgconf/maat.conf"
{{- if eq .Values.external_resources.sd.enable .Values.define_enable_val_yes }}
DYNAMIC_MAPPING_MAAT_SWITCH=1
{{- else }}
DYNAMIC_MAPPING_MAAT_SWITCH=0
{{- end }}

[TSG_LOG]
MODE=kafka
VSYSTEM_ID={{ .Values.vsys_id }}
NAMESPACE_ID=1
MAX_SERVICE=1
LOG_LEVEL=30
LOG_PATH="log/master.kafka"
COMPRESSION_TYPE="snappy"
SASL_USERNAME="{{ .Values.external_resources.olap.kafka_brokers.sasl_username }}"
SASL_PASSWD="{{ .Values.external_resources.olap.kafka_brokers.sasl_password }}"
BROKER_LIST="{{- include "traffic-engine.config.olap-address" (list .  ",") }}"
COMMON_FIELD_FILE="tsgconf/tsg_log_field.conf"
{{- if eq .Values.firewall.logs.contains_app_id.enable .Values.define_enable_val_yes }}
SEND_APP_ID_SWITCH=1
{{- else }}
SEND_APP_ID_SWITCH=0
{{- end }}
{{- if eq .Values.firewall.logs.contains_nat_linkinfo.enable .Values.define_enable_val_yes }}
SEND_NAT_LINKINFO_SWITCH=1
{{- else }}
SEND_NAT_LINKINFO_SWITCH=0
{{- end }}
SEND_INTERCEPT_LOG=1
TCP_MIN_PKTS=3
TCP_MIN_BYTES=5
UDP_MIN_PKTS=3
UDP_MIN_BYTES=5
RAPIDJSON_CHUNK_CAPACITY={{ .Values.firewall.rapidjson_chunk_capacity }}
{{- if eq .Values.define_enable_val_yes .Values.transaction_record.enable_http }}
SEND_HTTP_TRANSCATION_RECORD=1
{{- else }}
SEND_HTTP_TRANSCATION_RECORD=0
{{- end }}
{{- if eq .Values.define_enable_val_yes .Values.transaction_record.enable_dns }}
SEND_DNS_TRANSCATION_RECORD=1
{{- else }}
SEND_DNS_TRANSCATION_RECORD=0
{{- end }}
{{- if eq .Values.define_enable_val_yes .Values.transaction_record.enable_mail }}
SEND_MAIL_TRANSCATION_RECORD=1
{{- else }}
SEND_MAIL_TRANSCATION_RECORD=0
{{- end }}
{{- if eq .Values.define_enable_val_yes .Values.voip_record.enable_sip }}
SEND_SIP_RECORD=1
{{- else }}
SEND_SIP_RECORD=0
{{- end }}
{{- if eq .Values.define_enable_val_yes .Values.voip_record.enable_rtp }}
SEND_RTP_RECORD=1
{{- else }}
SEND_RTP_RECORD=0
{{- end }}
{{- if eq .Values.define_enable_val_yes .Values.packet_capture.enable }}
ENFORCE_TROUBLESHOOTING_SWITCH=1
{{- else }}
ENFORCE_TROUBLESHOOTING_SWITCH=0
{{- end }}


[SECURITY_HITS_METRICS]
CYCLE_INTERVAL_MS=1000
TELEGRAF_PORT=8400
TELEGRAF_IP="127.0.0.1"
APP_NAME="security_rule_hits"

[STATISTICS_HITS_METRICS]
CYCLE_INTERVAL_MS=1000
TELEGRAF_PORT=8400
TELEGRAF_IP="127.0.0.1"
APP_NAME="statistics_rule_hits"

[NETWORK_METRICS]
CYCLE_INTERVAL_MS=5000
TELEGRAF_PORT=8100
TELEGRAF_IP="127.0.0.1"
OUTPUT_PATH="log/master.metrics"
APP_NAME="statistic"

[APPLICATION_METRICS]
CYCLE_INTERVAL_MS=1000
TELEGRAF_PORT=8100
TELEGRAF_IP="127.0.0.1"
APP_NAME="app_metric"

[SYSTEM]
DATACENTER_ID={{ .Values.session_id_generator.snowflake_worker_id_base }}
LOG_LEVEL=30
LOG_PATH="log/firewall.log"
L7_PROTOCOL_FILE="./tsgconf/firewall_l7_protocol.conf"
DEVICE_ID_COMMAND="hostname | awk -F'-' '{print $3}'| awk -F'adc' '{print $2}'"
DEVICE_SEQ_IN_DATA_CENTER={{ .Values.session_id_generator.snowflake_worker_id_offset }}
{{- if eq .Values.service_chaining.enable .Values.define_enable_val_yes }}
SERVICE_CHAINING_SID={{ .Values.sid.sce }}
{{- end }}
{{- if eq .Values.shaping.enable .Values.define_enable_val_yes }}
SHAPING_SID={{ .Values.sid.shaping }}
{{- end }}
{{- if eq .Values.proxy.enable .Values.define_enable_val_yes }}
PROXY_SID={{ .Values.sid.proxy }}
{{- end }}
{{- if eq .Values.decoders.SSL_JA3 .Values.define_enable_val_yes }}
GENERATE_JA3_FINGERPRINT=1
{{- else }}
GENERATE_JA3_FINGERPRINT=0
{{- end }}

[context_based_detector]
LOG_LEVEL=30
LOG_PATH="log/context_based_detector.log"
SENDBACK_SWITCH=0

[APP_SKETCH_FEEDBACK]
QOS=0
PUBLISH_TOPIC="APP_SIGNATURE_ID"
#CLIENT_ID=
#BROKER_IP=
#BROKER_PORT=

[APP_PROTO_ENGINE]
debug_swtich=30
nb_flows=10000
intput_max_packet=20
classification_cache_enable=0
basic_dpi_enable=1
fm_flow_table_alloc_mode=3

[TSG_DDOS_SKETCH]
debug_swtich=30
throughput=1
mv_depth=4
mv_width=13660
timestemp=5
max_report_num=5000
min_report_num=0
tcp_flood_thresh="{{ .Values.ddos_event.tcp_traffic_report_ratio }}"
udp_flood_thresh="{{ .Values.ddos_event.udp_traffic_report_ratio }}"
icmp_flood_thresh="{{ .Values.ddos_event.icmp_traffic_report_ratio }}"
dns_flood_thresh="{{ .Values.ddos_event.dns_traffic_report_ratio }}"

[TRAFFIC_MIRROR]
{{- if eq .Values.traffic_mirror.enable_raw_traffic .Values.define_enable_val_yes }}
TRAFFIC_MIRROR_ENABLE=1
{{- else }}
TRAFFIC_MIRROR_ENABLE=0
{{- end }}
{{- if .Values.nic_mirror_name.firewall }}
NIC_NAME="{{ .Values.nic_mirror_name.firewall }}"
{{- end }}
APP_NAME="sapp-mirror-{{ .Values.app_symbol_index }}"
DEFAULT_VLAN_ID=0
[RADIUS_PLUG]
DEVICE_TAGS={"tags":[{{- include "traffic-engine.device-tag-list" . }}]}
PACKET_TYPE_FLAG=16
COLLECT_TOPIC="RADIUS-RECORD"
SERVICE_ID=162
LOG_PATH="log/radius_collect"
LOG_LEVEL=30

{{- if eq .Values.decoders.GTPC .Values.define_enable_val_yes }}
[GTP_SIGNALING]
{{- if eq .Values.gtpc_record.enable .Values.define_enable_val_yes }}
SENDLOG_SWITCH=1
{{- else }}
SENDLOG_SWITCH=0
{{- end }}
#NO/HASH/REDIS
SIGNALING_ORIGIN="REDIS"
{{- end }}

[PROTO_IDENTIFY]
MAX_IDENTIFY_PACKETS=10

[SESSION_FLAGS]
#RANDOM_LOOKING_JUDGE_LIST={"random_looking_judge_list":[ "frequency", "block_frequency", "cumulative_sums", "runs", "longest_run", "rank", "non_overlapping_template_matching", "overlapping_template_matching", "universal", "random_excursions", "random_excursions_variant", "poker_detect", "runs_distribution", "self_correlation", "binary_derivative" ]}
RANDOM_LOOKING_JUDGE_LIST={"random_looking_judge_list":[]}
