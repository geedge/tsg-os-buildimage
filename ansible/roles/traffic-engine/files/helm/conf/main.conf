[VOIP_PLUG]
TIMEOUT=300
LOG_PATH="./tsglog/fw_voip_plug/fw_voip_plug"
LOG_LEVEL=30
TABLE_TO=TSG_FIELD_SIP_RESPONDER_DESCRIPTION
TABLE_FROM=TSG_FIELD_SIP_ORIGINATOR_DESCRIPTION

[FTP_PLUG]
LOG_PATH="./tsglog/fw_ftp_plug/fw_ftp_plug"
LOG_LEVEL=30
TIMEOUT=600

[MAIL_PLUG]
LOG_PATH="./tsglog/fw_mail_plug/fw_mail_plug"
LOG_LEVEL=30
TIMEOUT=600

[HTTP_PLUG]
LOG_PATH="./tsglog/fw_http_plug/fw_http_plug"
LOG_LEVEL=30

[DNS_PLUG]
LOG_PATH="./tsglog/fw_dns_plug/fw_dns_plug"
LOG_LEVEL=30

[QUIC_PLUG]
LOG_PATH="./tsglog/fw_quic_plug/fw_quic_plug"
LOG_LEVEL=30

[CONTROL_PLUG]
LOG_PATH="./tsglog/app_control_plug/app_control_plug"
LOG_LEVEL=30

[MAAT]
PROFILE="./tsgconf/maat.conf"
SUBSCRIBER_ID_TABLE="TSG_OBJ_SUBSCRIBER_ID"
CB_SUBSCRIBER_IP_TABLE="TSG_DYN_SUBSCRIBER_IP"
IP_ADDR_TABLE="TSG_SECURITY_ADDR"
LOCATION_TABLE_TYPE=19

[TSG_LOG]
MODE=1
VSYSTEM_ID=1
NAMESPACE_ID=1
NIC_NAME="{{ .Values.nic_policy_log_name }}"
MAX_SERVICE=1
LOG_LEVEL=30
LOG_PATH="./tsglog/tsglog"
SASL_USERNAME="{{ .Values.external_resources.olap.kafka_brokers.sasl_username }}"
SASL_PASSWD="{{ .Values.external_resources.olap.kafka_brokers.sasl_password }}"
BROKER_LIST="{{- include "traffic-engine.config.olap-address" (list .  ",") }}"
COMMON_FIELD_FILE="tsgconf/tsg_log_field.conf"

[STATISTIC]
CYCLE=5
TELEGRAF_PORT=8100
TELEGRAF_IP="127.0.0.1"
OUTPUT_PATH="./tsg_statistic.log"
APP_NAME="statistic"

[FIELD_STAT]
CYCLE=5
TELEGRAF_PORT=8100
TELEGRAF_IP="127.0.0.1"
OUTPUT_PATH="./tsg_stat.log"
APP_NAME="tsg_master"

[SYSTEM]
NIC_NAME="{{ .Values.nic_policy_log_name }}"
DATACENTER_ID={{ .Values.session_id_generator.snowflake_worker_id_base }}
LOG_LEVEL=30
LOG_PATH="./tsglog/tsg_master"
POLICY_PRIORITY_LABEL="POLICY_PRIORITY"
L7_PROTOCOL_FILE="./tsgconf/tsg_l7_protocol.conf"
DEVICE_ID_COMMAND="hostname | awk -F'-' '{print $3}'| awk -F'adc' '{print $2}'"
DEVICE_SEQ_IN_DATA_CENTER={{ .Values.session_id_generator.snowflake_worker_id_offset }}
FEATURE_TAMPER=1

[TSG_CONN_SKETCH]
tcp_min_pkts=3
tcp_min_bytes=5
udp_min_pkts=3
udp_min_bytes=5
log_service=2
interim_service=6
transaction_service=7
{{- if and (eq .Values.sessionrecord.enable .Values.define_enable_val_yes) (eq .Values.sessionrecord.interim_record.enable .Values.define_enable_val_yes) }}
interim_service_switch=1
{{- else }}
interim_service_switch=0
{{- end }}
{{- if and (eq .Values.sessionrecord.enable .Values.define_enable_val_yes) (eq .Values.sessionrecord.transaction_record.enable .Values.define_enable_val_yes) }}
transaction_service_switch=1
{{- else }}
transaction_service_switch=0
{{- end }}
interim_intervals_time = {{ .Values.sessionrecord.interim_record.intervals_in_sec }}
sendlog_in_tcp_close=1

[HOS_CONF]
{{- if eq .Values.external_resources.olap.hos_servers.use .Values.define_enable_val_yes }}
hos_serverip="{{- include "traffic-engine.config.hos-address" . }}"
hos_serverport={{- include "traffic-engine.config.hos-port" . }}
hos_token="{{ .Values.external_resources.olap.hos_servers.token }}"
hos_log_level=30
hos_each_upload_cache_size=1500
hos_each_upload_cache_count=10
{{- end }}

[APP_SKETCH_LOCAL]
LOG_LEVEL=30
LOG_PATH="./tsglog/app_sketch_local/app_sketch_local"
SENDBACK_SWITCH=0

[APP_SKETCH_FEEDBACK]
QOS=0
PUBLISH_TOPIC="APP_SIGNATURE_ID"
#CLIENT_ID=
#BROKER_IP=
#BROKER_PORT=

[APP_PROTO_ENGINE]
debug_swtich=30
nb_flows=8000
classification_cache_enable=2
basic_dpi_enable=1

[TSG_DDOS_SKETCH]
debug_swtich=30
throughput=1
mv_depth=4
mv_width=13660
timestemp=5
max_report_num=5000
min_report_num=0
tcp_flood_thresh="{{ .Values.ddos_event.tcp_traffic_report_ratio }}"
udp_flood_thresh="{{ .Values.ddos_event.udp_traffic_report_ratio }}"
icmp_flood_thresh="{{ .Values.ddos_event.icmp_traffic_report_ratio }}"
dns_flood_thresh="{{ .Values.ddos_event.dns_traffic_report_ratio }}"

[TRAFFIC_MIRROR]
{{- if eq .Values.traffic_mirror.enable_raw_traffic .Values.define_enable_val_yes }}
TRAFFIC_MIRROR_ENABLE=1
{{- else }}
TRAFFIC_MIRROR_ENABLE=0
{{- end }}
NIC_NAME={{ .Values.nic_mirror_name }}
DEFAULT_VLAN_ID=0
[RADIUS_PLUG]
DEVICE_TAGS={"tags":[{{- include "traffic-engine.device-tag-list" . }}]}
PACKET_TYPE_FLAG=16
COLLECT_TOPIC=RADIUS-RECORD
SERVICE_ID=162
LOG_PATH=./log/radius_collect_plug/radius_collect_plug
LOG_LEVEL=30

[GTP_SIGNALING]
{{- if eq .Values.gtpc_record.enable .Values.define_enable_val_yes }}
SENDLOG_SWITCH=1
{{- else }}
SENDLOG_SWITCH=0
{{- end }}
#NO/HASH/REDIS
SIGNALING_ORIGIN=REDIS

[CAPTURE]

HOS_IP="{{- include "traffic-engine.config.hos-address" . }}"
HOS_PORT={{- include "traffic-engine.config.hos-port" . }}
