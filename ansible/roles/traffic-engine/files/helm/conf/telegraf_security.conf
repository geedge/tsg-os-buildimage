# Telegraf Configuration
[global_tags]
   device_id = "${device_id}"
{{- range .Values.device.tags -}}
{{- range $key,$val := . }}
   {{ $key }} = {{ $val | quote }}
{{- end }}
{{- end }}
[agent]
   interval = "1s"
   round_interval = true
   metric_batch_size = 1000
   metric_buffer_limit = 10000
   collection_jitter = "0s"
   flush_interval = "1s"
   flush_jitter = "0s"
   precision = ""
   debug = false
   quiet = false
   logfile = ""
   hostname = ""
   omit_hostname = true


[[inputs.socket_listener]]
   service_address = "udp://:8400"
   data_format = "influx"

[[outputs.kafka]]
   sasl_username = "{{ .Values.external_resources.olap.kafka_brokers.sasl_username }}"
   sasl_password = "{{ .Values.external_resources.olap.kafka_brokers.sasl_password }}"
   brokers = [ "{{- include "traffic-engine.config.olap-address"  (list . "\",\"") }}" ]
  topic = "POLICY-RULE-METRICS"
  data_format = "json"
  json_timestamp_units = "1ms"

# add rename
[[processors.rename]]
   [[processors.rename.replace]]
     field = "hit_count_sum"
     dest = "hit_count"

   [[processors.rename.replace]]
     field = "in_bytes_sum"
     dest = "in_bytes"

   [[processors.rename.replace]]
     field = "out_bytes_sum"
     dest = "out_bytes"

    [[processors.rename.replace]]
     field = "in_pkts_sum"
     dest = "in_pkts"

    [[processors.rename.replace]]
     field = "out_pkts_sum"
     dest = "out_pkts"

[[aggregators.basicstats]]
  period = "1s"
  drop_original = true
  stats = ["sum"]
  fieldpass = ["hit_count", "in_bytes", "out_bytes", "in_pkts", "out_pkts"]
  namepass = ["security_rule_hits"]   # only "pass" swap metrics through the aggregator.
