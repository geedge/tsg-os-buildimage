[system]
nr_worker_threads={{- include "traffic-engine.sce.workerthread" . }}
enable_cpu_affinity=1
cpu_affinity_mask={{- include "traffic-engine.sce.cpu-affinity" . }}
firewall_sids={{ .Values.sid.firewall }}

[maat]
# 0:json 1:redis 2:iris
input_mode=1
stat_switch=1
perf_switch=1
scan_detail=0
deferred_load=0
effect_interval_ms=1000
stat_file=log/maat.fs2
table_info=resource/table_info.conf
accept_path=/opt/tsg/etc/tsg_device_tag.json
inc_cfg_dir=resource/inc/
ful_cfg_dir=resource/ful/
json_cfg_file=resource/sce.json
foreign_cont_dir=resource/foreign_files
redis_db_idx={{ .Values.vsys_id }}
redis_server={{ .Values.external_resources.cm.address }}
redis_port_range={{ .Values.external_resources.cm.port }}
max_chaining_size=32

[packet_io]
# bypass_all_traffic:1 NF2NF and SF2SF
bypass_all_traffic=0
rx_burst_max=128
app_symbol=sce
dev_endpoint={{ .Values.sce.endpoint_nic }}
dev_nf_interface={{ .Values.sce.steering_nic }}
dev_endpoint_src_ip={{ .Values.sce.endpoint_ip }}

# If the configuration file does not set src mac, get src mac through marsio_get_device_ether_addr();
# If the configuration file has src mac set, use the src mac in the file
# dev_endpoint_src_mac=aa:aa:aa:aa:aa:aa

[stat]
output_file=log/sce.fs2
statsd_server=127.0.0.1
statsd_port=8100
# 1 : FS_OUTPUT_STATSD
# 2 : FS_OUTPUT_INFLUX_LINE
statsd_format=2
statsd_cycle=2
prometheus_listen_port=9006
prometheus_listen_url=/metrics

[metrics]
# Kafka Topic: SERVICE-CHAINING-METRICS 
enable=1
interval_s=1
telegraf_bind_address=127.0.0.1
telegraf_listen_port=8300

[bfdd]
#path=/var/run/frr/bfdd_{{ .Values.vsys_id }}.vty
path=/var/run/frr/bfdd.vty
device={{ .Values.sce.endpoint_nic }}
gateway={{ .Values.sce.endpoint_gateway }}