# Telegraf Configuration
[global_tags]
   device_id = "${device_id}"
{{- range .Values.device.tags -}}
{{- range $key,$val := . }}
   {{ $key }} = {{ $val | quote }}
{{- end }}
{{- end }}
[agent]
   interval = "1s"
   round_interval = true
   metric_batch_size = 1000
   metric_buffer_limit = 100000
   collection_jitter = "0s"
   flush_interval = "1s"
   flush_jitter = "0s"
   precision = ""
   debug = false
   quiet = false
   logfile = ""
   hostname = ""
   omit_hostname = true


[[inputs.socket_listener]]
   service_address = "udp://:8300"
   data_format = "influx"

#[[processors.converter]]
#  [processors.converter.tags]
#    measurement = ["topic"]

[[processors.rename]]
   [[processors.rename.replace]]
     field = "sent_pkts_sum"
     dest = "sent_pkts"

   [[processors.rename.replace]]
     field = "sent_bytes_sum"
     dest = "sent_bytes"

   [[processors.rename.replace]]
     field = "recv_pkts_sum"
     dest = "recv_pkts"

   [[processors.rename.replace]]
     field = "recv_bytes_sum"
     dest = "recv_bytes"

[[aggregators.basicstats]]
  period = "1s"
  delay = "1s"
  grace = "1s"
  drop_original = true
  stats = ["sum"]
  fieldpass = ["sent_pkts", "sent_bytes", "recv_pkts", "recv_bytes"]
  namepass = ["service_chaining_rule_hits"]   # only "pass" swap metrics through the aggregator.

#[[outputs.file]]
#  files = ["/tmp/sce_metrics.json", "stdout"]
#  data_format = "json"
#  json_timestamp_units = "1ms"
#

[[outputs.kafka]]
   sasl_username = "{{ .Values.external_resources.olap.kafka_brokers.sasl_username }}"
   sasl_password = "{{ .Values.external_resources.olap.kafka_brokers.sasl_password }}"
   brokers = [ "{{- include "traffic-engine.config.olap-address"  (list . "\",\"") }}" ]
   topic = "POLICY-RULE-METRIC"
   data_format = "json"
   json_timestamp_units = "1ms"
