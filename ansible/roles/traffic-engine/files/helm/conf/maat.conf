[STATIC]
###file, json, redis
MAAT_MODE=redis
STAT_SWITCH=1
PERF_SWITCH=1
TABLE_INFO=tsgconf/tsg_static_tableinfo.json
STAT_FILE=tsg_static_maat.status
EFFECT_INTERVAL_S=1
REDIS_IP={{ .Values.external_resources.cm.address }}
REDIS_PORT={{ .Values.external_resources.cm.port }}
REDIS_INDEX={{ .Values.vsys_id }}
JSON_CFG_FILE=tsgconf/tsg_maat.json
INC_CFG_DIR=tsgrule/inc/index/
FULL_CFG_DIR=tsgrule/full/index/
EFFECTIVE_RANGE_FILE=/opt/tsg/etc/tsg_device_tag.json
LOG_PATH="log/master.maat"

[APP_SIGNATURE_MAAT]
###file, json, redis
MAAT_MODE=redis
STAT_SWITCH=1
PERF_SWITCH=1
TABLE_INFO=tsgconf/app_sketch_tableinfo.json
STAT_FILE=app_sketch_maat.status
EFFECT_INTERVAL_S=1
REDIS_IP={{ .Values.external_resources.cm.address }}
REDIS_PORT={{ .Values.external_resources.cm.port }}
REDIS_INDEX={{ .Values.vsys_id }}
JSON_CFG_FILE=tsgconf/app_sketch_maat.json
INC_CFG_DIR=tsgrule/inc/index/
FULL_CFG_DIR=tsgrule/full/index/
EFFECTIVE_RANGE_FILE=/opt/tsg/etc/tsg_device_tag.json
LOG_PATH="log/app_sketch.maat"

[CAPTURE]
MAAT_MODE=2
STAT_SWITCH=1
PERF_SWITCH=1
TABLE_INFO=tsgconf/capture_packet_tableinfo.json
STAT_FILE=capture_packet.status
EFFECT_INTERVAL_S=1
REDIS_IP={{ .Values.external_resources.cm.address }}
REDIS_PORT={{ .Values.external_resources.cm.port }}
REDIS_INDEX={{ .Values.vsys_id }}
JSON_CFG_FILE=tsgconf/capture_packet_maat.json
INC_CFG_DIR=tsgrule/inc/index/
FULL_CFG_DIR=tsgrule/full/index/
EFFECTIVE_RANGE_FILE=/opt/tsg/etc/tsg_device_tag.json

[MAAT]
ACCEPT_TAGS={"tags":[{{- include "traffic-engine.device-tag-list" . }}]}
