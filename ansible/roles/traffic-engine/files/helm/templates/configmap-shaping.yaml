{{- if eq .Values.shaping.enable .Values.define_enable_val_yes }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: shaping-{{ .Release.Name }}
  namespace: default
data:
  shaping.conf: {{ tpl (.Files.Get "conf/shaping.conf") . | quote }}
  tsg_device_tag.json: {{ tpl (.Files.Get "conf/tsg_device_tag.json") . | quote }}
{{- end }}