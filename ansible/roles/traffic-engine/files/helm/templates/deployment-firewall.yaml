apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-firewall
  labels:
    app: {{ .Release.Name }}
    component: firewall
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-firewall
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-firewall
        vsysId: "{{ .Values.vsys_id }}"
        serviceFunction: {{ .Release.Name }}
        component: firewall
      annotations:
        prometheus.io/port: "9010"
        prometheus.io/scrape: "true"
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      serviceAccountName: {{ .Release.Name }}
      containers:
      - name: firewall
        image: "registry.gdnt-cloud.website/tsg-firewall:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/sapp
        command:
          - "bash"
          - "-ec"
          - |
            ldconfig
            {{- include "traffic-engine.global.cm.read-server-ip" . | nindent 12 }}
            {{- if eq .Values.external_resources.cm.connectivity "local_cache" }}
            sed -Ei "s|CM_POLICY_LOCAL_CACHE_IP_LOCATION|${CM_POLICY_LOCAL_CACHE_IP?}|g" /opt/tsg/sapp/tsgconf/maat.conf
            {{- end }}
            {{- include "traffic-engine.global.sd.read-server-ip" . | nindent 12 }}
            {{- if eq .Values.external_resources.sd.connectivity "local_cache" }}
            sed -Ei "s|SD_POLICY_LOCAL_CACHE_IP_LOCATION|${SD_POLICY_LOCAL_CACHE_IP?}|g" /opt/tsg/sapp/tsgconf/maat.conf
            {{- end }}
            {{ template "traffic-engine.firewall.prestart" . }}
            {{ template "traffic-engine.firewall.start" . }}
        ports:
          - containerPort: 9273
        env:
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- if eq .Values.external_resources.cm.connectivity "local_cache" }}
        - name: CM_CACHE_SERVICE_NAME
          value: {{ .Values.external_resources.cm.local_cache.cache_name }}-redis-master
        {{- end }}
        {{- if eq .Values.external_resources.sd.enable .Values.define_enable_val_yes }}
        {{- if eq .Values.external_resources.sd.connectivity "local_cache" }}
        - name: SD_CACHE_SERVICE_NAME
          value: {{ .Values.external_resources.sd.local_cache.cache_name }}-redis-master
        {{- end }}
        {{- end }}
        securityContext:
          privileged: true
{{- if eq .Values.debug.firewall.enable_liveness_probe .Values.define_enable_val_yes }}
        livenessProbe:
          tcpSocket:
            port: 9273
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9273
          failureThreshold: 90
          periodSeconds: 10
{{- end }}

        volumeMounts:
        - name: shared-configs-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "tsg_sn.json"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/plug/conflist.inf"
          subPath: "sapp/conflist.inf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/etc/gdev.conf"
          subPath: "sapp/gdev.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/tsgconf/main.conf"
          subPath: "sapp/main.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/tsgconf/maat.conf"
          subPath: "sapp/maat.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/etc/sapp.toml"
          subPath: "sapp/sapp.toml"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/etc/send_raw_pkt.conf"
          subPath: "sapp/send_raw_pkt.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/etc/tsg_device_tag.json"
          subPath: "sapp/tsg_device_tag.json"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/etc/vlan_flipping_map.conf"
          subPath: "sapp/vlan_flipping_map.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/plug/business/firewall/firewall.inf"
          subPath: "sapp/firewall.inf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/etc/necessary_plug_list.conf"
          subPath: "sapp/necessary_plug_list.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/conf/http/http_main.conf"
          subPath: "sapp/http_main.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/conf/mail/mail.conf"
          subPath: "sapp/mail.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/conf/ssl/ssl_main.conf"
          subPath: "sapp/ssl_main.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/sapp/stellar_plugin/spec.toml"
          subPath: "sapp/spec.toml"
        - name: firewall-minidump
          mountPath: /run/sapp/crashreport
        - name: firewall-log
          mountPath: /opt/tsg/sapp/log
        - name: metrics-json-dir
          mountPath: "/opt/tsg/sapp/metrics"
        {{ template "traffic-engine.mount.mrzcpd" . }}
        {{ template "traffic-engine.mount.localtime" . }}
        {{ template "traffic-engine.firewall.mount.prestart" . }}
        {{ template "traffic-engine.firewall.mount.hostpath" . }}
        {{ template "traffic-engine.mount.dev-bus-usb" . }}
        {{ template "traffic-engine.mount.dev-shm" . }}

      - name: fieldstat-exporter
        image: "registry.gdnt-cloud.website/tsg-firewall:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            ldconfig
            python3 /opt/tsg/framework/bin/fieldstat_exporter.py prometheus -p 9011 -d /opt/tsg/sapp/metrics
        ports:
          - containerPort: 9011
        securityContext:
          privileged: true
        livenessProbe:
          tcpSocket:
            port: 9011
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9011
          failureThreshold: 5
          periodSeconds: 10
        volumeMounts:
        - name: metrics-json-dir
          mountPath: "/opt/tsg/sapp/metrics"
        {{ template "traffic-engine.mount.localtime" . }}

      - name: merged-exporter
        image: "quay.io/rebuy/exporter-merger:v0.2.0"
        imagePullPolicy: Never
        env:
        - name: MERGER_URLS
          value: http://127.0.0.1:9273/metrics http://127.0.0.1:9011/metrics
        - name: MERGER_PORT
          value: "9010"
        ports:
        - containerPort: 9010

      - name: log-dir-hook
        image: "registry.gdnt-cloud.website/tsg-firewall:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            while true; do touch /opt/tsg/sapp/log/.log_dir_hook; sleep 600; done
        securityContext:
          privileged: true
        volumeMounts:
        - name: firewall-log
          mountPath: /opt/tsg/sapp/log

      initContainers:
      - name: firewall-init
        image: "registry.gdnt-cloud.website/tsg-init:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            cp -r /opt/tsg/configs/* /opt/tsg/shared-configs/
            {{- include "public.prepare-access-API" . | nindent 12 }}
            {{- include "public.serialize-node-annotations" . | nindent 12 }}
        securityContext:
          privileged: true
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: shared-configs-volume
          mountPath: /opt/tsg/shared-configs
        - name: sapp-configs-volume
          mountPath: /opt/tsg/configs/sapp
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true

      volumes:
      - name: sapp-configs-volume
        configMap:
          name: sapp-{{ .Release.Name }}
      - name: shared-configs-volume
        emptyDir: {}
      - name: metrics-json-dir
        emptyDir: {}
      - name: firewall-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-firewall:{{ .Chart.AppVersion }}/
      - name: firewall-log
        hostPath: 
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/sapp/
      - name: prestart-dir
        hostPath: 
          path: /etc/tsg-os/{{ .Release.Name }}/
          type: DirectoryOrCreate
      {{ template "traffic-engine.volume.mrzcpd" . }}
      {{ template "traffic-engine.volume.localtime" . }}
      {{ template "traffic-engine.firewall.volume.prestart" . }}
      {{ template "traffic-engine.volume.hostpath" . }}
      {{ template "traffic-engine.volume.dev-bus-usb" . }}
      {{ template "traffic-engine.volume.dev-shm" . }}