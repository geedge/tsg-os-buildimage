apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-engine-{{ .Release.Name }}
  labels:
    app: traffic-engine-{{ .Release.Name }}

spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-engine-{{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: traffic-engine-{{ .Release.Name }}
        vsysId: "{{ .Values.vsys_id }}"
        serviceFunction: {{ .Values.nic_raw_name }}
      annotations:
        configHash: "{{ .Values.configHash }}"
        prometheus.io/port: "9004"
        prometheus.io/scrape: "true"

    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: firewall
        image: "docker.io/library/tsg-firewall:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/sapp
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.firewall.copy-config-to-dest" . }}
            {{ template "traffic-engine.firewall.prestart" . }}
            exec /opt/tsg/sapp/sapp
        ports:
          - containerPort: 9273
        env:
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
        livenessProbe:
          tcpSocket:
            port: 9273
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9273
          failureThreshold: 90
          periodSeconds: 10
        volumeMounts:
        - name: opt-tsg-mrzcpd
          mountPath: /opt/tsg/mrzcpd
          readOnly: false
        - name: var-run-mrzcpd
          mountPath: /var/run/mrzcpd
          readOnly: false
        - name: var-run-dpdk
          mountPath: /var/run/dpdk
          readOnly: false
        - name: root-sys
          mountPath: /root/sys
          readOnly: false
        - name: sapp
          mountPath: "/opt/tsg/config"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: firewall-minidump
          mountPath: /run/sapp/crashreport
        - name: firewall-log
          mountPath: /opt/tsg/sapp/log
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
        - name: hotfix-firewall
          mountPath: /etc/traffic-engine/hotfix/firewall

{{- if and (eq .Values.proxy.enable .Values.define_enable_val_yes) (ge (len .Values.tfe_affinity) 1) }}
      - name: proxy
        image: "docker.io/library/tsg-proxy:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/tfe
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.proxy.copy-config-to-dest" . }}
            {{ template "traffic-engine.proxy.prestart" . }}
            exec /opt/tsg/tfe/bin/tfe
        ports:
          - containerPort: 9001
        env:
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
        livenessProbe:
          tcpSocket:
            port: 9001
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9001
          failureThreshold: 30
          periodSeconds: 10
        volumeMounts:
        - name: tfe
          mountPath: "/opt/tsg/config"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: proxy-minidump
          mountPath: /run/tfe/crashreport
        - name: proxy-log
          mountPath: /opt/tsg/tfe/log
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
        - name: hotfix-proxy
          mountPath: /etc/traffic-engine/hotfix/proxy
{{- end }}

      - name: certstore
        image: "docker.io/library/tsg-certstore:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/certstore
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.certstore.copy-config-to-dest" . }}
            {{ template "traffic-engine.certstore.prestart" . }}
            exec /opt/tsg/certstore/bin/certstore
        securityContext:
          privileged: true
        ports:
          - containerPort: 9002
        volumeMounts:
        - name: certstore
          mountPath: "/opt/tsg/config"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: certstore-minidump
          mountPath: /run/certstore/crashreport
        - name: certstore-log
          mountPath: /opt/tsg/certstore/logs
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
        - name: hotfix-certstore
          mountPath: /etc/traffic-engine/hotfix/certstore

      - name: cert-redis
        image: "docker.io/library/tsg-certstore:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command: ["/usr/bin/redis-server", "/etc/cert-redis.conf"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true       

      - name: telegraf
        image: "docker.io/library/tsg-telegraf:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command: ["/usr/bin/telegraf", "-config", "/etc/telegraf/telegraf_statistic.conf", "-config-directory", "/etc/telegraf/telegraf_statistic.d"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: telegraf
          mountPath: "/etc/telegraf/telegraf_statistic.conf"
          subPath: "telegraf_statistic.conf"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: config-volume
          mountPath: "/etc/default/telegraf"
          subPath: "etc/default/telegraf"
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true

{{- if eq .Values.shaping.enable .Values.define_enable_val_yes }}
      - name: shaping
        image: "docker.io/library/tsg-shaping:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/shaping_engine
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.shaping.copy-config-to-dest" . }}
            {{ template "traffic-engine.shaping.get-service-node-port" . }}
            {{ template "traffic-engine.shaping.set-shaping-config" . }}
            {{ template "traffic-engine.shaping.prestart" . }}
            exec /opt/tsg/shaping_engine/bin/shaping_engine
        ports:
          - containerPort: 8551
          - containerPort: 8552
          - containerPort: 9007
        env:
        - name: SERVICENAME
          value: shaping-announce-port-{{ .Release.Name }}
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        livenessProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 30
          periodSeconds: 10
        securityContext:
          privileged: true
        volumeMounts:
        - name: opt-tsg-mrzcpd
          mountPath: /opt/tsg/mrzcpd
          readOnly: false
        - name: var-run-mrzcpd
          mountPath: /var/run/mrzcpd
          readOnly: false
        - name: var-run-dpdk
          mountPath: /var/run/dpdk
          readOnly: false
        - name: root-sys
          mountPath: /root/sys
          readOnly: false
        - name: shaping
          mountPath: "/opt/tsg/config"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: shaping-minidump
          mountPath: /run/shaping/crashreport
        - name: shaping-log
          mountPath: /opt/tsg/shaping/log
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
        - name: hotfix-shaping
          mountPath: /etc/traffic-engine/hotfix/shaping

      - name: telegraf-shaping
        image: "docker.io/library/tsg-telegraf:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command: ["/usr/bin/telegraf", "-config", "/etc/telegraf/telegraf_shaping.conf", "-config-directory", "/etc/telegraf/telegraf_statistic.d"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: telegraf
          mountPath: "/etc/telegraf/telegraf_shaping.conf"
          subPath: "telegraf_shaping.conf"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: config-volume
          mountPath: "/etc/default/telegraf"
          subPath: "etc/default/telegraf"
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
{{- end }}

      - name: merge-exporter
        image: "quay.io/rebuy/exporter-merger:v0.2.0"
        imagePullPolicy: Never
        ports:
        - containerPort: 9004
        env:
        # space-separated list of URLs
        - name: MERGER_URLS
          {{- include "traffic-engine.merge-exporter.merge-urls" . | nindent 10 }}
        - name: MERGER_PORT
          value: "9004"

      - name: minidump-hook
        image: "docker.io/library/tsg-init:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command: ["/bin/sh", "-c", "while true; do touch /run/sapp/crashreport/.minidump; touch /run/tfe/crashreport/.minidump; touch /run/certstore/crashreport/.minidump; sleep 600; done"]
        volumeMounts:
        - name: firewall-minidump
          mountPath: /run/sapp/crashreport
        - name: proxy-minidump
          mountPath: /run/tfe/crashreport
        - name: certstore-minidump
          mountPath: /run/certstore/crashreport

{{- if and (eq .Values.service_chaining.enable .Values.define_enable_val_yes) (.Values.sce_config.endpoint_nic) }}
      - name: telegraf-sce
        image: "docker.io/library/tsg-telegraf:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command: ["/usr/bin/telegraf", "-config", "/etc/telegraf/telegraf_sce.conf", "-config-directory", "/etc/telegraf/telegraf_statistic.d"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: telegraf
          mountPath: "/etc/telegraf/telegraf_sce.conf"
          subPath: "telegraf_sce.conf"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: config-volume
          mountPath: "/etc/default/telegraf"
          subPath: "etc/default/telegraf"
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true

      - name: sce
        image: "docker.io/library/tsg-sce:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/sce
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.sce.copy-config-to-dest" . }}
            {{ template "traffic-engine.sce.prestart" . }}
            exec /opt/tsg/sce/bin/sce
        ports:
          - containerPort: 9006
        env:
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
        livenessProbe:
          tcpSocket:
            port: 9006
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9006
          failureThreshold: 30
          periodSeconds: 10
        volumeMounts:
        - name: opt-tsg-mrzcpd
          mountPath: /opt/tsg/mrzcpd
          readOnly: false
        - name: var-run-mrzcpd
          mountPath: /var/run/mrzcpd
          readOnly: false
        - name: var-run-dpdk
          mountPath: /var/run/dpdk
          readOnly: false
        - name: root-sys
          mountPath: /root/sys
          readOnly: false
        - name: sce
          mountPath: "/opt/tsg/config"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: sce-minidump
          mountPath: /run/sce/crashreport
        - name: sce-log
          mountPath: /opt/tsg/sce/log
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
        - name: hotfix-sce
          mountPath: /etc/traffic-engine/hotfix/sce
        - name: bfdd-unix-socket
          mountPath: /run/frr

      - name: bfdd
        image: "docker.io/library/tsg-bfdd:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/bfdd
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.bfdd.prestart" . }}
            exec /opt/tsg/bfdd/bfdd -u root -g root
        env:
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
        volumeMounts:
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: bfdd-minidump
          mountPath: /run/bfdd/crashreport
        - name: bfdd-log
          mountPath: /opt/tsg/bfdd/log
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true
        - name: hotfix-bfdd
          mountPath: /etc/traffic-engine/hotfix/bfdd
        - name: bfdd-unix-socket
          mountPath: /run/frr
{{- end }}


      initContainers:
      - name: tsg-init
        image: "docker.io/library/tsg-init:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.init" . }}
        securityContext:
          privileged: true
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: config-volume
          mountPath: /target_config 
        - name: localtime-node
          mountPath: /etc/localtime
          readOnly: true

      volumes:
      - name: opt-tsg-mrzcpd
        hostPath:
          path: /opt/tsg/mrzcpd
      - name: var-run-mrzcpd
        hostPath:
          path: /var/run/mrzcpd
      - name: var-run-dpdk
        hostPath:
          path: /var/run/dpdk
      - name: root-sys
        hostPath:
          path: /root/sys
      - name: telegraf
        configMap:
          name: telegraf-{{ .Release.Name }}
      - name: certstore
        configMap:
          name: certstore-{{ .Release.Name }}
      - name: tfe
        configMap:
          name: tfe-{{ .Release.Name }}
      - name: sapp
        configMap:
          name: sapp-{{ .Release.Name }}
      - name: sce
        configMap:
          name: sce-{{ .Release.Name }}
      - name: shaping
        configMap:
          name: shaping-{{ .Release.Name }}
      - name: config-volume
        emptyDir: {}
      - name: firewall-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-firewall:{{ .Chart.AppVersion }}/
      - name: proxy-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-proxy:{{ .Chart.AppVersion }}/
      - name: sce-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-sce:{{ .Chart.AppVersion }}/
      - name: bfdd-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-bfdd:{{ .Chart.AppVersion }}/
      - name: certstore-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-certstore:{{ .Chart.AppVersion }}/
      - name: shaping-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-shaping:{{ .Chart.AppVersion }}/
      - name: firewall-log
        hostPath: 
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/sapp/
      - name: proxy-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/tfe/
      - name: sce-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/sce/
      - name: bfdd-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/bfdd/
      - name: certstore-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/certstore/
      - name: shaping-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/shaping/
      - name: localtime-node
        hostPath:
          path: /etc/localtime
      - name: hotfix-firewall
        hostPath:
          path: /etc/traffic-engine/hotfix/firewall
      - name: hotfix-proxy
        hostPath:
          path: /etc/traffic-engine/hotfix/proxy
      - name: hotfix-certstore
        hostPath:
          path: /etc/traffic-engine/hotfix/certstore
      - name: hotfix-sce
        hostPath:
          path: /etc/traffic-engine/hotfix/sce
      - name: hotfix-bfdd
        hostPath:
          path: /etc/traffic-engine/hotfix/bfdd
      - name: hotfix-shaping
        hostPath:
          path: /etc/traffic-engine/hotfix/shaping
      - name: bfdd-unix-socket
        emptyDir: {}
