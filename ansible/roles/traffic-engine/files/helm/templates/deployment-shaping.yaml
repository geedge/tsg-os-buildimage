{{- if eq .Values.shaping.enable .Values.define_enable_val_yes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shaping
  labels:
    app: {{ .Release.Name }}
    component: shaping
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-shaping
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-shaping
        vsysId: "{{ .Values.vsys_id }}"
        serviceFunction: {{ .Release.Name }}
        component: shaping
      annotations:
        prometheus.io/port: "9007"
        prometheus.io/scrape: "true"

    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      serviceAccountName: {{ .Release.Name }}
      containers:
      - name: shaping
        image: "registry.gdnt-cloud.website/tsg-shaping:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/shaping_engine
        command:
          - "bash"
          - "-ec"
          - |
            ldconfig
            {{ template "traffic-engine.shaping.copy-config-to-dest" . }}
            {{ template "traffic-engine.global.cm.read-server-ip" . }}
            {{ template "traffic-engine.shaping.set-redis-ip" . }}
            {{ template "traffic-engine.shaping.get-service-node-port" . }}
            {{ template "traffic-engine.shaping.set-shaping-config" . }}
            {{ template "traffic-engine.shaping.prestart" . }}
            {{ template "traffic-engine.shaping.start" . }}
        ports:
          - containerPort: 8551
          - containerPort: 8552
          - containerPort: 9007
        env:
        - name: SERVICENAME
          value: shaping-announce-port-{{ .Release.Name }}
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{ template "traffic-engine.global.cm.env-service-name" . }}
{{- if eq .Values.debug.shaping.enable_liveness_probe .Values.define_enable_val_yes }}
        livenessProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 30
          periodSeconds: 10
{{- end }}
        securityContext:
          privileged: true
        volumeMounts:
        - name: shaping
          mountPath: "/opt/tsg/config"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: shaping-minidump
          mountPath: /run/shaping/crashreport
        - name: shaping-log
          mountPath: /opt/tsg/shaping/log
        {{ template "traffic-engine.mount.mrzcpd" . }}
        {{ template "traffic-engine.mount.localtime" . }}
        {{ template "traffic-engine.shaping.mount.prestart" . }}
        {{ template "traffic-engine.shaping.mount.hostpath" . }}        

      - name: telegraf-shaping
        image: "registry.gdnt-cloud.website/tsg-telegraf:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            /usr/bin/telegraf -config /etc/telegraf/telegraf_shaping.conf -config-directory /etc/telegraf/telegraf_statistic.d
        securityContext:
          privileged: true
        volumeMounts:
        - name: telegraf
          mountPath: "/etc/telegraf/telegraf_shaping.conf"
          subPath: "telegraf_shaping.conf"
        - name: config-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "opt/tsg/etc/tsg_sn.json"
        - name: config-volume
          mountPath: "/etc/profile.d/device_id.sh"
          subPath: "etc/profile.d/device_id.sh"
        {{ template "traffic-engine.mount.localtime" . }}

      - name: log-dir-hook
        image: "registry.gdnt-cloud.website/tsg-shaping:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            while true; do touch /opt/tsg/shaping/log/.log_dir_hook; sleep 600; done
        securityContext:
          privileged: true
        volumeMounts:
        - name: shaping-log
          mountPath: /opt/tsg/shaping/log

      initContainers:
      - name: shaping-init
        image: "registry.gdnt-cloud.website/tsg-init:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            {{ template "traffic-engine.init" . }}
        securityContext:
          privileged: true
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: config-volume
          mountPath: /target_config 
        {{ template "traffic-engine.mount.localtime" . }}

      volumes:
      - name: telegraf
        configMap:
          name: telegraf-{{ .Release.Name }}
      - name: shaping
        configMap:
          name: shaping-{{ .Release.Name }}
      - name: config-volume
        emptyDir: {}
      - name: shaping-minidump
        hostPath:
          path: /var/crashreport/traffic-engine/traffic-engine-{{ .Release.Name }}/tsg-shaping:{{ .Chart.AppVersion }}/
      - name: shaping-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/shaping/
      - name: prestart-dir
        hostPath: 
          path: /etc/tsg-os/{{ .Release.Name }}/
          type: DirectoryOrCreate
      {{ template "traffic-engine.volume.mrzcpd" . }}
      {{ template "traffic-engine.volume.localtime" . }}
      {{ template "traffic-engine.shaping.volume.prestart" . }}
      {{ template "traffic-engine.volume.hostpath" . }}
{{- end }}