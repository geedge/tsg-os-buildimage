{{- if eq .Values.shaping.enable .Values.define_enable_val_yes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shaping
  labels:
    app: {{ .Release.Name }}
    component: shaping
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-shaping
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-shaping
        vsysId: "{{ .Values.vsys_id }}"
        serviceFunction: {{ .Release.Name }}
        component: shaping
      annotations:
        prometheus.io/port: "9007"
        prometheus.io/scrape: "true"

    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      serviceAccountName: {{ .Release.Name }}
      containers:
      - name: shaping
        image: "registry.gdnt-cloud.website/tsg-shaping:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/shaping_engine
        command:
          - "bash"
          - "-ec"
          - |
            ldconfig
            {{- include "public.prepare-access-API" . | nindent 12 }}
            {{- if eq .Values.external_resources.cm.connectivity "local_cache" }}
            {{- include "traffic-engine.global.cm.read-server-ip" . | nindent 12 }}
            sed -Ei -c "s|CM_POLICY_LOCAL_CACHE_IP_LOCATION|${CM_POLICY_LOCAL_CACHE_IP?}|g" /opt/tsg/shaping_engine/conf/shaping.conf
            {{- end }}
            curl --cacert ${CACERT} --header "Authorization: Bearer ${TOKEN}" -X GET ${APISERVER}/api/v1/namespaces/${NAMESPACE}/services/${SERVICENAME} -o /tmp/service.txt
            export CLUSTER_ANNOUNCE_PORT=$(cat /tmp/service.txt | jq '.spec.ports[] | select(.name=="cluster-announce-port") | .nodePort')
            export HEALTH_CHECK_ANNOUNCE_PORT=$(cat /tmp/service.txt | jq '.spec.ports[] | select(.name=="healthcheck-announce-port") | .nodePort')
            echo "export CLUSTER_ANNOUNCE_PORT=${CLUSTER_ANNOUNCE_PORT}" > /etc/profile.d/announceinfo.sh
            echo "export HEALTH_CHECK_ANNOUNCE_PORT=${HEALTH_CHECK_ANNOUNCE_PORT}" >> /etc/profile.d/announceinfo.sh
            chmod 0755 /etc/profile.d/announceinfo.sh

            sed -Ei -c "s|NODE_IP_LOCATION|${NODE_IP?}|g" /opt/tsg/shaping_engine/conf/shaping.conf
            sed -Ei -c "s|CLUSTER_ANNOUNCE_PORT_LOCATION|${CLUSTER_ANNOUNCE_PORT?}|g" /opt/tsg/shaping_engine/conf/shaping.conf
            sed -Ei -c "s|HEALTH_CHECK_ANNOUNCE_PORT_LOCATION|${HEALTH_CHECK_ANNOUNCE_PORT?}|g" /opt/tsg/shaping_engine/conf/shaping.conf
            {{- if eq .Values.debug.shaping.enable_prestart_script .Values.define_enable_val_yes }}
            echo WARNING: PRESTART.sh is enable, the commands in PRESTART.sh is:
            cat /opt/tsg/scripts/prestart.sh
            
            chmod 0755 /opt/tsg/scripts/prestart.sh
            /opt/tsg/scripts/prestart.sh

            echo PRESTART.sh has been exec......
            {{- end }}
            {{- if eq .Values.debug.shaping.enable_interactive_startup .Values.define_enable_val_yes }}
            while true; do sleep 10;done
            {{- else }}
            exec /opt/tsg/shaping_engine/bin/shaping_engine 2>&1|tee >(systemd-cat -t $DEPLOYMENT_NAME)
            {{- end }}
        ports:
          - containerPort: 8551
          - containerPort: 8552
          - containerPort: 9007
        env:
        - name: DEPLOYMENT_NAME
          value: {{ .Release.Name }}-shaping
        - name: SERVICENAME
          value: shaping-announce-port-{{ .Release.Name }}
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- if eq .Values.external_resources.cm.connectivity "local_cache" }}
        - name: CM_CACHE_SERVICE_NAME
          value: {{ .Values.external_resources.cm.local_cache.cache_name }}-redis-master
        {{- end }}
{{- if eq .Values.debug.shaping.enable_liveness_probe .Values.define_enable_val_yes }}
        livenessProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 30
          periodSeconds: 10
{{- end }}
        securityContext:
          privileged: true
        volumeMounts:
        - name: journal-volume
          mountPath: /run/systemd/journal
        - name: shared-configs-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "tsg_sn.json"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/shaping_engine/conf/shaping.conf"
          subPath: "shaping/shaping.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/etc/tsg_device_tag.json"
          subPath: "shaping/tsg_device_tag.json"
        - name: shaping-log
          mountPath: /opt/tsg/shaping/log
        {{- include "public.sync-host-timezone.volume-mount" . | nindent 8 }}
        {{- if eq .Values.debug.shaping.enable_prestart_script .Values.define_enable_val_yes }}
        - name: prestart-dir
          mountPath: /tmp/prestart
        - name: shaping-prestart
          mountPath: /opt/tsg/scripts/prestart.sh
        {{- end }}
        {{- if eq .Values.debug.shaping.enable_mount_host_filesystem .Values.define_enable_val_yes }}
        - name: host-root
          mountPath: /host
        {{- end }}
        {{- include "traffic-engine.mount.mrzcpd" . | nindent 8 }}

      - name: telegraf-shaping
        image: "registry.gdnt-cloud.website/tsg-telegraf:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            source /etc/profile.d/device_id.sh
            /usr/bin/telegraf -config /etc/telegraf/telegraf_shaping.conf -config-directory /etc/telegraf/telegraf_statistic.d
        securityContext:
          privileged: true
        volumeMounts:
        - name: telegraf-configs-volume
          mountPath: "/etc/telegraf/telegraf_shaping.conf"
          subPath: "telegraf_shaping.conf"
        - name: shared-configs-volume
          mountPath: "/opt/tsg/etc/tsg_sn.json"
          subPath: "tsg_sn.json"
        - name: shared-configs-volume
          mountPath: "/etc/profile.d/device_id.sh"
          subPath: "device_id.sh"
        {{- include "public.sync-host-timezone.volume-mount" . | nindent 8 }}

      - name: log-dir-hook
        image: "registry.gdnt-cloud.website/tsg-shaping:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            while true; do touch /opt/tsg/shaping/log/.log_dir_hook; sleep 600; done
        securityContext:
          privileged: true
        volumeMounts:
        - name: shaping-log
          mountPath: /opt/tsg/shaping/log

      initContainers:
      - name: shaping-init
        image: "registry.gdnt-cloud.website/tsg-init:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        command:
          - "bash"
          - "-ec"
          - |
            cp -r /opt/tsg/configs/* /opt/tsg/shared-configs/
            {{- include "public.prepare-access-API" . | nindent 12 }}
            {{- include "public.serialize-node-annotations" . | nindent 12 }}
        securityContext:
          privileged: true
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      
        volumeMounts:
        - name: shared-configs-volume
          mountPath: /opt/tsg/shared-configs
        - name: shaping-configs-volume
          mountPath: /opt/tsg/configs/shaping
        {{- include "public.sync-host-timezone.volume-mount" . | nindent 8 }}

      volumes:
      - name: journal-volume
        hostPath:
          path: /run/systemd/journal
          type: Directory
      - name: telegraf-configs-volume
        configMap:
          name: telegraf-{{ .Release.Name }}
      - name: shaping-configs-volume
        configMap:
          name: shaping-{{ .Release.Name }}
      - name: shared-configs-volume
        emptyDir: {}
      - name: shaping-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/shaping/
      {{- include "traffic-engine.volume.mrzcpd" . | nindent 6 }}
      {{- include "public.sync-host-timezone.volume" . | nindent 6 }}
      {{- if eq .Values.debug.shaping.enable_prestart_script .Values.define_enable_val_yes }}
      - name: prestart-dir
        hostPath: 
          path: /etc/tsg-os/{{ .Release.Name }}/
          type: DirectoryOrCreate
      - name: shaping-prestart
        hostPath:
      {{- if .Values.debug.shaping.prestart_script }}
          path: {{ .Values.debug.shaping.prestart_script }}
      {{- else }}
          path: /etc/tsg-os/{{ .Release.Name }}/shaping_prestart_script.sh
      {{- end }}
          type: FileOrCreate
      {{- end }}
      {{- if eq .Values.debug.shaping.enable_mount_host_filesystem .Values.define_enable_val_yes }}
      - name: host-root
        hostPath:
          path: /
      {{- end }}
{{- end }}