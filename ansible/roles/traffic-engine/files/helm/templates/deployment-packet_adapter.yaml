{{- if eq .Values.inject_adapter.enable .Values.define_enable_val_yes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inject-adapter
  labels:
    app: {{ .Release.Name }}
    component: inject-adapter
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-inject-adapter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-inject-adapter
        vsysId: "{{ .Values.vsys_id }}"
        serviceFunction: {{ .Release.Name }}
        component: inject_adapter
      annotations:
        prometheus.io/port: "9007"
        prometheus.io/scrape: "true"

    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: inject-adapter
        image: "registry.gdnt-cloud.website/tsg-inject:{{ .Chart.AppVersion }}"
        imagePullPolicy: Never
        workingDir: /opt/tsg/packet_adapter
        command:
          - "bash"
          - "-ec"
          - |
            ldconfig
            {{ template "traffic-engine.inject_adapter.copy-config-to-dest" . }}
            {{ template "traffic-engine.inject_adapter.prestart" . }}
            {{ template "traffic-engine.inject_adapter.start" . }}
        ports:
          - containerPort: 9007
        env:
        - name: SERVICENAME
          value: inject-adapter-announce-port-{{ .Release.Name }}
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MRZCPD_CTRLMSG_LISTEN_ADDR
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVERRIDE_SLED_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
{{- if eq .Values.debug.inject_adapter.enable_liveness_probe .Values.define_enable_val_yes }}
        livenessProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 1
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 9007
          failureThreshold: 30
          periodSeconds: 10
{{- end }}
        securityContext:
          privileged: true
        volumeMounts:
        - name: inject-adapter
          mountPath: "/opt/tsg/config"
        - name: inject-log
          mountPath: /opt/tsg/packet_adapter/log
        {{ template "traffic-engine.mount.mrzcpd" . }}
        {{ template "traffic-engine.mount.localtime" . }}
        {{ template "traffic-engine.inject_adapter.mount.prestart" . }}
        {{ template "traffic-engine.inject_adapter.mount.hostpath" . }}    
      hostNetwork: true
      volumes:
      - name: inject-adapter
        configMap:
          name: inject-adapter-{{ .Release.Name }}
      - name: prestart-dir
        hostPath: 
          path: /etc/tsg-os/{{ .Release.Name }}/
          type: DirectoryOrCreate
      - name: inject-log
        hostPath:
          path: /var/log/traffic-engine/traffic-engine-{{ .Release.Name }}/inject/
      {{ template "traffic-engine.volume.mrzcpd" . }}
      {{ template "traffic-engine.volume.localtime" . }}
      {{ template "traffic-engine.inject_adapter.volume.prestart" . }}
      {{ template "traffic-engine.volume.hostpath" . }}
{{- end }}