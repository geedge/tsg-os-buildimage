apiVersion: v1
kind: Service
metadata:
  labels:
    app: shaping-announce-port-{{ .Release.Name }}
  name: shaping-announce-port-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}

spec:
  ports:
  - name: cluster-announce-port
    port: 8551
    targetPort: 8551
  - name: healthcheck-announce-port
    port: 8552
    targetPort: 8552
  selector:
    app: {{ .Release.Name }}-shaping
  type: NodePort
