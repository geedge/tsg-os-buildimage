---
- name: "Copy patch files to /tmp/9000_NPB/patch/ dir"
  copy:
    src: "{{ role_path }}/files/patch/"
    dest: /tmp/9000_NPB/patch/

- name: "Copy install files to /tmp/9000_NPB dir"
  copy:
    src: "{{ role_path }}/files/install.sh"
    dest: /tmp/9000_NPB/

- name: "Archive 9000 NPB patch tags"
  shell: tar -zcvf /tmp/9000_NPB/patch.tar.gz -C /tmp/9000_NPB/patch/ .

- name: "Build self-extracting scripts"
  shell: cat /tmp/9000_NPB/install.sh /tmp/9000_NPB/patch.tar.gz > /tmp/9000_NPB/tsg-os_9000-NPB-P01R01_patch.bin

- name: "Chmod +x tsg-os_9000-NPB-P01R01_patch.bin"
  shell: chmod 0755 /tmp/9000_NPB/tsg-os_9000-NPB-P01R01_patch.bin