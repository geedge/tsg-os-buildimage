- name: "tsg-os-provision: copy tsg-os-provision scripts to dest"
  copy:
    src: "{{ role_path }}/files/tsg-os-provision"
    dest: /opt/tsg/
    mode: 0644

- name: "tsg-os-provision: copy tasks file that excutes provision to dest  - tsg9140"
  copy:
    src: "{{ role_path }}/files/provision_tasks_files/provision.yml.9000NPBP01R01"
    dest: /opt/tsg/tsg-os-provision/tasks/provision.yml
    mode: 0644
  when: PROFILE_ID == '9000-NPB-P01R01'

- name: "tsg-os-provision: copy tasks file that excutes provision to dest - tsg7400 mcn0"
  copy:
    src: "{{ role_path }}/files/provision_tasks_files/provision.yml.7400MCN0P01R01"
    dest: /opt/tsg/tsg-os-provision/tasks/provision.yml
    mode: 0644
  when: PROFILE_ID == '7400-MCN0-P01R01'

- name: "tsg-os-provision: copy tasks file that excutes provision to dest - tsg7400 mcn1 mcn2 mcn3"
  copy:
    src: "{{ role_path }}/files/provision_tasks_files/provision.yml.7400MCN123P01R01"
    dest: /opt/tsg/tsg-os-provision/tasks/provision.yml
    mode: 0644
  when: PROFILE_ID == '7400-MCN123-P01R01'

- name: "tsg-os-provision: copy tsg-os-provision-convertor.service file to dest"
  copy:
    src: "{{ role_path }}/files/tsg-os-provision-convertor.service"
    dest: /usr/lib/systemd/system/tsg-os-provision-convertor.service
    mode: 0644

- name: "tsg-os-provision: copy tsg-os-provision.service file to dest"
  copy:
    src: "{{ role_path }}/files/tsg-os-provision.service"
    dest: /usr/lib/systemd/system/tsg-os-provision.service
    mode: 0644

- name: "tsg-os-provision: chmod 0755 for provison.sh"
  file:
    path: "{{ item }}"
    mode: '0755'
  with_items:
    - /opt/tsg/tsg-os-provision/provision.sh


- name: "tsg-os-provision: enable tsg-os-provison and tsg-os-provison-convertor"
  systemd:
    name: "{{ item }}"
    enabled: yes
  with_items:
    - tsg-os-provision
    - tsg-os-provision-convertor

- name: "tsg-os-provision: install yaml module using pip3"
  pip:
    name: PyYAML
    executable: pip3