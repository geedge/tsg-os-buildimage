---
- name: "Create /opt/tsg/tsg-os-provision/scripts/"
  file:
    path: "/opt/tsg/tsg-os-provision/scripts/"
    state: directory

- name: "deploy obtain sn tsg-7400"
  copy:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "/opt/tsg/tsg-os-provision/scripts/{{ item.dest }}"
    mode: 0755
  with_items:
    - { "src": "obtain_sn.sh.TSG7400", "dest": "obtain_sn.sh" }
    - { "src": "cmm_api_tst", "dest": "cmm_api_tst" }
  when: runtime_env == 'TSG-7400-mcn0' or runtime_env == 'TSG-7400-mcn123'

- name: "deploy obtain sn - tsg-9140"
  copy:
    src: "{{ role_path }}/files/obtain_sn.sh.TSG9140"
    dest: /opt/tsg/tsg-os-provision/scripts/obtain_sn.sh
    mode: 0755
  when: runtime_env == 'TSG-9140'

- name: "deploy obtain sn - tsg-x-P0906"
  copy:
    src: "{{ role_path }}/files/obtain_sn.sh.TSGXP1403"
    dest: /opt/tsg/tsg-os-provision/scripts/obtain_sn.sh
    mode: 0755
  when: runtime_env == 'TSG-X-P0906'


- name: "deploy obtain sn - tsg-x-p0906"
  copy:
    src: "{{ role_path }}/files/obtain_sn.sh.TSGXP0906-init"
    dest: /opt/tsg/tsg-os-provision/scripts/obtain_sn.sh
    mode: 0755
  when: runtime_env == 'TSG-X-P0906' and PROFILE_ID == 'TSG-X-NXR620G40-R01-P0906-init'