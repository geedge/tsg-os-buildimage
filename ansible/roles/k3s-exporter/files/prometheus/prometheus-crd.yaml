apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  chart: https://%{KUBERNETES_API}%/static/charts/prometheus-25.8.2.tgz
  targetNamespace: tsg-os-system
  valuesContent: |-
    kube-state-metrics:
      image:
        pullPolicy: Never
    server:
      image:
        pullPolicy: Never
      service:
        servicePort: 8080
        nodePort: 30080
        type: NodePort
      global:
        scrape_interval: 15s
    configmapReload:
      prometheus:
        image:
          pullPolicy: Never
      alertmanager:
        image:
          pullPolicy: Never
    alertmanager:
      image:
        pullPolicy: Never
    prometheus-pushgateway:
      nameOverride: pushgateway
      image:
        pullPolicy: Never

    prometheus-node-exporter:
      nameOverride: node-exporter
      image:
        pullPolicy: Never
      service:
        annotations:
          prometheus.io/scrape: "true"
          tsg/monitor: "true"
      extraArgs:
        - --collector.ethtool
        - --collector.ethtool.device-include=.*
        - --collector.ethtool.metrics-include=.*
        - --collector.cpu.info
        - --collector.netdev
        - --collector.netdev.address-info

    serverFiles:
      prometheus.yml:
        scrape_configs:
          - job_name: 'cadvisor'
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

            kubernetes_sd_configs:
              - role: node

            relabel_configs:
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
            metric_relabel_configs:
              - source_labels: [pod]
                action: replace
                target_label: serviceFunction
                regex: (.*)-(firewall|proxy|shaping|service-chaining)-([a-z0-9]+)-([a-z0-9]+)
                replacement: $1
              - regex:  instance
                action: labeldrop
              - regex: id
                action: labeldrop
              - regex: image
                action: labeldrop
              - regex: name
                action: labeldrop
              - regex: namespace
                action: labeldrop
              - regex: pod
                action: labeldrop
              - source_labels: [__name__, device]
                separator: ';'
                regex: '^container_fs\w+;(.+k3s/containerd.+|.+kubelet/pods.+)'
                action: drop
              - source_labels: [__name__, device]
                separator: ';'
                regex: '^container_fs\w+;overlay.+'
                action: drop

          - job_name: 'exporter'
            honor_labels: true

            kubernetes_sd_configs:
              - role: endpoints

            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace]
                action: keep
                regex: tsg-os-system
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape_slow]
                action: drop
                regex: true
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                action: replace
                target_label: __scheme__
                regex: (https?)
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                action: replace
                target_label: __address__
                regex: (.+?)(?::\d+)?;(\d+)
                replacement: $1:$2
              - source_labels: [__meta_kubernetes_service_name]
                action: replace
                target_label: service
            metric_relabel_configs:
              - source_labels: [app]
                action: replace
                target_label: serviceFunctionIndex
                regex: (sapp4|tfe|shaping|sce)(-|_)(.*)
                replacement: $3
              - source_labels: [__name__, device]
                separator: ';'
                regex: '^node\w+;(lo|usb\d+|cnibr\d+|docker\d+|br_dign_[sc]|virtio_dign_[sc]|veth\w+)'
                action: drop
              - source_labels: [__name__, type]
                separator: ';'
                regex: '^systemd\w+;(scope|mount|device|slice)'
                action: drop
              - regex:  image_id
                action: labeldrop
              - regex:  container_id
                action: labeldrop
              - regex:  uid
                action: labeldrop
              - regex:  image_spec
                action: labeldrop
              - source_labels: [mountpoint]
                separator: ';'
                regex: '(.+k3s/containerd.+|.+kubelet/pods.+)'
                action: drop
              - regex:  instance
                action: labeldrop


          - job_name: 'traffic-engine'
            honor_labels: true

            kubernetes_sd_configs:
              - role: pod

            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace]
                action: keep
                regex: default
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_slow]
                action: drop
                regex: true
              - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                action: replace
                regex: (.+?)(?::\d+)?;(\d+)
                replacement: $1:$2
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: serviceFunction
                regex: (.*)-(firewall|proxy|shaping|service-chaining)-([a-z0-9]+)-([a-z0-9]+)
                replacement: $1
              - source_labels: [__meta_kubernetes_pod_label_vsysId]
                action: replace
                target_label: vsysId
                regex: (.+)
              - source_labels: [__meta_kubernetes_pod_label_component]
                action: replace
                target_label: component
                regex: (.+)

              - source_labels: [__meta_kubernetes_pod_phase]
                regex: Pending|Succeeded|Failed|Completed
                action: drop
            metric_relabel_configs:
              - regex:  instance
                action: labeldrop

