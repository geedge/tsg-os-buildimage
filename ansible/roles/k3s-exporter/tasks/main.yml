- name: "copy namespace tsg-os-system file to dest"
  copy:
    src: "{{ role_path }}/files/ns-tsg-os-system.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/

- name: "copy ipmi crd file to dest"
  copy:
    src: "{{ role_path }}/files/ipmi/ipmi-crd.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/

- name: "copy ipmi chart to dest"
  copy:
    src: "{{ role_path }}/files/ipmi/ipmi-exporter-0.1.9.tgz"
    dest: /var/lib/rancher/k3s/server/static/charts/

- name: "get ipmi chart images to dest"
  get_url:
    url: https://repo.geedge.net/filerepo/install/release/tsg-container-images/ipmi-exporter.tar
    dest: /var/lib/rancher/k3s/agent/images/ipmi-exporter.tar
    url_username: "{{ lookup('env', 'PULP_REPO_USERNAME') }}"
    url_password: "{{ lookup('env', 'PULP_REPO_PASSWORD') }}"

- name: "copy prometheus crd file to dest"
  copy:
    src: "{{ role_path }}/files/prometheus/prometheus-crd.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/

- name: "copy prometheus chart to dest"
  copy:
    src: "{{ role_path }}/files/prometheus/prometheus-15.16.1.tgz"
    dest: /var/lib/rancher/k3s/server/static/charts/

- name: "get prometheus chart images to dest"
  get_url:
    url: "https://repo.geedge.net/filerepo/install/release/tsg-container-images/{{ item }}"
    dest: "/var/lib/rancher/k3s/agent/images/{{ item }}"
    url_username: "{{ lookup('env', 'PULP_REPO_USERNAME') }}"
    url_password: "{{ lookup('env', 'PULP_REPO_PASSWORD') }}"
  loop:
    - prometheus-alertmanager.tar
    - prometheus-config-reload.tar
    - prometheus-node-exporter.tar
    - prometheus-pushgateway.tar
    - prometheus.tar
    - kube-state-metrics.tar

- name: "copy chart directory to dest"
  copy:
    src: "{{ role_path }}/files/mrzcpd/helm"
    dest: /tmp/exporter-mrzcpd/

- name: "create charts packages"
  shell: helm package --app-version {{os_release_ver}}  --version {{helm_chart_ver}} -d /var/lib/rancher/k3s/server/static/charts/  /tmp/exporter-mrzcpd/helm

- name: "copy prometheus crd file to dest"
  template:
    src: "{{ role_path }}/templates/exporter-mrzcpd-crd.yaml.j2"
    dest: /var/lib/rancher/k3s/server/manifests/exporter-mrzcpd-crd.yaml

- name: "get merge-exporter images to dest"
  get_url:
    url: https://repo.geedge.net/filerepo/install/release/tsg-container-images/exporter-merger.tar
    dest: /var/lib/rancher/k3s/agent/images/exporter-merger.tar
    url_username: "{{ lookup('env', 'PULP_REPO_USERNAME') }}"
    url_password: "{{ lookup('env', 'PULP_REPO_PASSWORD') }}"
