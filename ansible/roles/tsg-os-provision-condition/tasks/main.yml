    - mrenv
    - mrzcpd
    - sapp
    - telegraf_statistic
  when: PROFILE_ID == '7400-MCN0-P01R01'

- name: "add condition into service depend provision result TSG7400 MCN0"
  copy:
    src: "{{ role_path }}/files/service_add_ConditionPathExists.conf"
