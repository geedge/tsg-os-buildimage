- name: "add condition into service depend provision result - TSG9140"
  copy:
    src: "{{ role_path }}/files/service_add_ConditionPathExists.conf"
    dest: "/usr/lib/systemd/system/{{ item }}.service.d/"
    mode: 0644
  with_items:
    - cert-redis
    - certstore
    - mrapm_device
    - mrapm_stream
    - mrenv
    - mrzcpd
    - sapp
    - telegraf_statistic
    - tfe-env
    - tfe
  when: PROFILE_ID == '9000-NPB-P01R01'

- name: "add condition into service depend provision result TSG7400 MCN0"
