# TOD: TSG-6386 调整 TSG-OS 中的脚本， 适配 TSG-7400 硬件平台
# variable format {role_name}.{configname}.{section}.{var}  configname 用 "_" 替代 "."

firewall:
  capture_packet_plug_conf:
    LOG:
      NIC_NAME: eth_ctl
  main_conf:
    TSG_LOG:
      NIC_NAME: eth_ctl

kni:
  kni_conf:
    global:
      tfe_node_count: 3
      manage_eth: eth_ctl
    tfe0:
      dev_eth_symbol: eth_mcn1
      ip_addr: 192.168.100.2
    tfe1:
      dev_eth_symbol: eth_mcn2
      ip_addr: 192.168.100.3
    tfe2:
      dev_eth_symbol: eth_mcn3
      ip_addr: 192.168.100.4
    tfe_cmsg_receiver:
      listen_eth: eth_pf.100
    watch_dog:
      listen_eth: eth_pf.100

mrzcpd:
  mrglobal_conf_mcn0:
    device:
      nic_raw: eth_raw
      nic_mcn1: eth_mcn1
      nic_mcn2: eth_mcn2
      nic_mcn3: eth_mcn3
    service:
      iocore: 52,53,54,55
  mrglobal_conf_mcn123:
    device:
      nic_mirr: eth_mirr_d
    service:
      iocore: 53,54 