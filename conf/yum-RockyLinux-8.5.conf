baseurl=http://mirrors.aliyun.com/rockylinux/8.5/BaseOS/x86_64/os/
gpgcheck=1
gpgkey=http://mirrors.aliyun.com/rockylinux/8.5/BaseOS/x86_64/os/RPM-GPG-KEY-rockyofficial

