[main]
cachedir=/var/cache/yum/x86_64/8
keepcache=0
debuglevel=2
logfile=/var/log/yum.log
exactarch=1
obsoletes=1
plugins=1
installonly_limit=5
distroverpkg=rocky-release
reposdir=./

[base]
name=RockyLinux-8.5 - Base - mirrors.aliyun.com
