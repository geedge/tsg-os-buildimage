[main]
cachedir=/var/cache/yum/$basearch/9
keepcache=0
debuglevel=2
logfile=/var/log/yum.log
exactarch=1
obsoletes=1
plugins=1
installonly_limit=5
distroverpkg=rocky-release
reposdir=./

[base]
name=RockyLinux-9 - Base - mirrors.aliyun.com
#failovermethod=priority
baseurl=http://mirrors.aliyun.com/rockylinux/9/BaseOS/$basearch/os/
gpgcheck=0

[extras]
name=RockyLinux-9 - Extras - mirrors.aliyun.com
#failovermethod=priority
baseurl=http://mirrors.aliyun.com/rockylinux/9/extras/$basearch/os/
gpgcheck=0

[docker-ce-stable]
name=Docker CE Stable
baseurl=http://mirrors.aliyun.com/docker-ce/linux/centos/9/$basearch/stable/
enabled=1
gpgcheck=0

[CRB]
name=RockyLinux-9 - CRB - mirrors.aliyun.com
baseurl=http://mirrors.aliyun.com/rockylinux/9/CRB/$basearch/os/
gpgcheck=0
enabled=1

[epel]
name=Extra Packages for Enterprise Linux 9 - $basearch
baseurl=http://mirrors.aliyun.com/epel/9/Everything/$basearch/
enabled=1
gpgcheck=0

[App]
name=App Packages for Enterprise Linux 9 - $basearch
baseurl=http://mirrors.aliyun.com/rockylinux/9/AppStream/$basearch/os/
enabled=1
gpgcheck=0

[framework]
name=framework
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/framework/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[platform]
name=platform
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/platform/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[protocol]
name=protocol
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/protocol/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[tsg]
name=tsg
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/tsg/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[AppSktech]
name=AppSketch
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/AppSketch/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[tfe]
name=tfe
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/tfe/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[stellar]
name=stellar
baseurl=https://repo.geedge.net/pulp/content/9/$basearch/stable/stellar/
enabled=1
gpgcheck=0
username=PULP_REPO_USERNAME
password=PULP_REPO_PASSWORD

[doca]
name=doca
baseurl=https://linux.mellanox.com/public/repo/doca/2.8.0/rhel9.4/arm64-sbsa/
enabled=1
gpgcheck=0