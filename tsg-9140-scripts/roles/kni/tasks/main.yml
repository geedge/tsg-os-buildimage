---
- name: "copy kni to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: /tmp/ansible_deploy/

- name: "install kni rpms from localhost"
  yum:
    name:
      - "{{ kni_rpm_version }}"
    state: present
#    skip_broken: yes

- name: Template the kni.conf
  template:
    src: "{{ role_path }}/templates/kni.conf.j2"
    dest: /home/mesasoft/sapp_run/etc/kni/kni.conf
  tags: template


