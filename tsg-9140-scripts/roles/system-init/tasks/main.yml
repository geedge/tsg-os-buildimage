  template:
    src: "{{ role_path }}/templates/if-pre-down.toml.j2"
    dest: /etc/NetworkManager/dispatcher.d/pre-down.d/if-pre-down
    mode: 0755
  tags: template

- name: "set setup.enp1s0.ips"
  template:
    src: "{{ role_path }}/templates/setup.enp1s0.ips.toml.j2"
    dest: /sbin/setup.enp1s0.ips
    mode: 0777
  tags: template

- name: "set setup.enp130s0.ips"
