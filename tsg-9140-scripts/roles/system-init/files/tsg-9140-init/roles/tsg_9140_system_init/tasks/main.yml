---
##################### mrzcpd #####################
- name: "enable mrenv"
  systemd:
    name: mrenv
    enabled: yes

- name: "enable mrzcpd"
  systemd:
    name: mrzcpd
    enabled: yes

- name: "enable prometheus output - monit_device"
  systemd:
    name: mrapm_device
    enabled: yes

- name: "enable prometheus output - monit_stream"
  systemd:
    name: mrapm_stream
    enabled: yes

##################### sapp #####################
- name: "enable sapp"
  systemd:
    name: sapp
    enabled: yes

##################### kni #####################
- name: "enable sapp"
  systemd:
    name: sapp
    enabled: yes

##################### certstore #####################
- name: "start certstore"
  systemd:
    name: certstore.service
    state: started
    enabled: yes

##################### cert-redis #####################
- name: "start cert-redis"
  systemd:
    name: cert-redis.service
    state: started
    enabled: yes

##################### tfe #####################
- name: "enable tfe-env"
  systemd:
    name: tfe-env
    enabled: yes

- name: "enable tfe"
  systemd:
    name: tfe
    enabled: yes

##################### telegraf #####################
- name: "Start telegraf"
  systemd:
    name: telegraf_statistic.service
    state: started
    enabled: yes

##################### exporter #####################
- name: 'exporter-node service start'
  systemd:
    name: exporter-node
    enabled: yes
    state: started

- name: 'exporter-systemd service start'
  systemd:
    name: exporter-systemd
    enabled: yes
    state: restarted

- name: 'exporter-ipmi service start'
  systemd:
    name: exporter-ipmi
    enabled: yes
    state: restarted
##################### Tsg-diagnose #####################
- name: 'Tsg-diagnose service start'
  systemd:
    name: tsg-diagnose
    enabled: yes
    state: started