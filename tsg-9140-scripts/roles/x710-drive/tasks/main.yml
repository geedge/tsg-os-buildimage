---
- name: "copy x710 drive rpms to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: "/tmp/x710_drive/"

- name: "install x710 drive"
  yum:
    name:
      - /tmp/x710_drive/i40e-2.15.9-1.x86_64.rpm
    state: present

- name: "install iavf"
  yum:
    name:
      - /tmp/x710_drive/iavf-4.1.1-1.x86_64.rpm
    state: present

- name: "update  depmod"
  shell: depmod -v 5.4.113-1.el7.elrepo.x86_64

- name: "update  initramfs"
  shell: dracut --force -v /boot/initramfs-5.4.113-1.el7.elrepo.x86_64.img 5.4.113-1.el7.elrepo.x86_64